function openSnippets() {
  const sheet = openSheet('定型文');
  const row = el('div', '', 'snippet-row');
  const input = document.createElement('input');
  input.placeholder = '登録する文章';
  const addBtn = el('button', '追加', 'chip');
  addBtn.addEventListener('click', () => {
    const v = input.value.trim();
    if (!v) return;
    snippets.push(v); saveSnippets(); input.value = ''; paint();
  });
  row.append(input, addBtn);
  sheet.appendChild(row);
  const list = document.createElement('div');
  sheet.appendChild(list);
  function paint() {
    list.textContent = '';
    if (!snippets.length) { list.appendChild(el('div', 'まだありません。', 'sr-empty')); return; }
    snippets.forEach((sn, i) => {
      const item = el('div', '', 'snippet-item');
      item.appendChild(el('span', sn));
      const use = el('button', '使う');
      use.addEventListener('click', () => {
        textInput.value += (textInput.value ? '\n' : '') + sn;
        autoGrow(textInput); updateByteCounter(); closeSheet(); textInput.focus();
      });
      const del = el('button', '削除');
      del.addEventListener('click', () => { snippets.splice(i, 1); saveSnippets(); paint(); });
      item.append(use, del);
      list.appendChild(item);
    });
  }
  paint();
}

async function wipeRoom() {
  if (!confirm('この部屋のメッセージと画像を「全員ぶん」削除します。参加者アカウントは残ります。取り消せません。')) return;
  if (!confirm('本当に実行しますか？ この操作は元に戻せません。')) return;
  showToast('削除中…');
  try {
    const folders = await supabase.storage.from(BUCKET).list('', { limit: 1000 });
    const paths = [];
    for (const f of folders.data || []) {
      if (f.id) { paths.push(f.name); continue; }
      const files = await supabase.storage.from(BUCKET).list(f.name, { limit: 1000 });
      for (const x of files.data || []) paths.push(`${f.name}/${x.name}`);
    }
    for (let i = 0; i < paths.length; i += 100) {
      await supabase.storage.from(BUCKET).remove(paths.slice(i, i + 100));
    }
    await supabase.from('reactions').delete().neq('emoji', '');
    const { error } = await supabase.from('messages').delete().neq('sender_name', '\u0000');
    if (error) throw error;
    bookmarks.clear(); saveBookmarks();
    pinnedMsg = null; paintPinBar();
    storageUsedBytes = 0; applyStorageFullState();
    closeSheet();
    showToast('すべて削除しました');
    await loadLatest();
    refreshDbUsage();
  } catch (e) {
    showToast('削除に失敗しました: ' + (e.message || e));
  }
}

async function bulkDeleteMine(imagesOnly) {
  const what = imagesOnly ? '自分が送った画像すべて' : '自分の発言すべて';
  if (!confirm(`${what}を削除します。取り消せません。よろしいですか？`)) return;
  let q = supabase.from('messages').select('id,image_url,image_bytes').eq('sender_dbid', myDbid);
  if (imagesOnly) q = q.not('image_url', 'is', null);
  const { data, error } = await q;
  if (error) { showToast('取得に失敗しました'); return; }
  if (!data.length) { showToast('対象はありませんでした'); return; }
  const paths = data.filter((m) => m.image_url).map((m) => pathFromUrl(m.image_url)).filter(Boolean);
  if (imagesOnly) {
    await supabase.from('messages').update({ image_url: null, image_bytes: null })
      .eq('sender_dbid', myDbid).not('image_url', 'is', null);
  } else {
    await supabase.from('messages').delete().eq('sender_dbid', myDbid);
  }
  if (paths.length) {
    for (let i = 0; i < paths.length; i += 100) await supabase.storage.from(BUCKET).remove(paths.slice(i, i + 100));
  }
  closeSheet();
  showToast(`${data.length}件を削除しました`);
  await loadLatest();
  refreshStorageUsage();
}

function updateFavicon() {
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const x = c.getContext('2d');
    x.fillStyle = prefs.accent || '#06c755';
    x.beginPath(); x.roundRect(2, 2, 60, 60, 14); x.fill();
    x.fillStyle = '#fff'; x.font = 'bold 34px sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle';
    const n = totalUnread();
    x.fillText(n > 0 ? String(Math.min(n, 99)) : '💬', 32, 34);
    let link = document.querySelector('link[rel="icon"]');
    if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
    link.href = c.toDataURL('image/png');
  } catch (_) {}
}

let wakeLock = null;
async function toggleWakeLock(on) {
  try {
    if (on) { wakeLock = await navigator.wakeLock.request('screen'); showToast('画面を消えないようにしました'); }
    else { await wakeLock?.release(); wakeLock = null; }

}

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(() => showToast('全画面にできません'));
}

function installManifest() {
  const manifest = {
    name: 'Simple Talk', short_name: 'Simple Talk', start_url: location.pathname,
    display: 'standalone', background_color: '#e5ebee', theme_color: prefs.accent || '#06c755',

async function cleanupOrphanImages(btn) {
  if (!confirm('どのメッセージからも参照されていない画像を削除します。よろしいですか？')) return;
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = '確認中…';

  try {
    const referenced = new Set();
    for (let from = 0; ; from += 1000) {
      const { data, error } = await supabase.from('messages').select('image_url')
        .not('image_url', 'is', null).range(from, from + 999);
      if (error) throw error;
      for (const r of data) referenced.add(pathFromUrl(r.image_url));
      if (data.length < 1000) break;
    }

    const all = [];
    const { data: folders, error: fErr } = await supabase.storage.from(BUCKET)
      .list('', { limit: 1000 });
    if (fErr) throw fErr;
    for (const folder of folders || []) {
      if (folder.id) { all.push({ path: folder.name, size: folder.metadata?.size }); continue; }
      const { data: files } = await supabase.storage.from(BUCKET)
        .list(folder.name, { limit: 1000 });
      for (const f of files || []) all.push({ path: `${folder.name}/${f.name}`, size: f.metadata?.size });
    }

    const orphans = all.filter((f) => !referenced.has(f.path));
    if (!orphans.length) { showToast('掃除する画像はありませんでした'); return; }

    btn.textContent = `${orphans.length}件を削除中…`;
    const freed = orphans.reduce((n, f) => n + (Number(f.size) || 0), 0);
    for (let i = 0; i < orphans.length; i += 100) {
      const { error } = await supabase.storage.from(BUCKET)
        .remove(orphans.slice(i, i + 100).map((f) => f.path));
      if (error) throw error;
    }
    storageUsedBytes = Math.max(0, storageUsedBytes - freed);
    applyStorageFullState();
    showToast(`${orphans.length}件（約${(freed / (1024 * 1024)).toFixed(1)}MB）を削除しました`);
  } catch (e) {
    showToast('掃除に失敗しました: ' + (e.message || e));
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}

function pathFromUrl(url) {
  const marker = `/object/public/${BUCKET}/`;
  const i = String(url).indexOf(marker);
  return i < 0 ? '' : decodeURIComponent(String(url).slice(i + marker.length).split('?')[0]);
}

async function exportLog(btn) {
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = '書き出し中…';
  try {
    const lines = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await supabase.from('messages').select('*')
        .order('created_at', { ascending: true }).range(from, from + 999);
      if (error) throw error;
      for (const m of data) {
        const when = new Date(m.created_at).toLocaleString('ja-JP');
        const body = (m.content || '').replace(/\n/g, '\n    ');
        lines.push(`[${when}] ${m.sender_name}` + (m.image_url ? '（画像あり）' : ''));
        if (body) lines.push('    ' + body);
        if (m.image_url) lines.push('    ' + m.image_url);
        lines.push('');
      }
      if (data.length < 1000) break;
    }
    const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `talk-log-${new Date().toISOString().slice(0, 10)}.txt`;
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('保存しました');
  } catch (e) {
    showToast('書き出しに失敗しました: ' + (e.message || e));
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}

function notifyIncoming(m) {
  const mention = mentionsMe(m.content);
  if (Date.now() < (prefs.muteUntil || 0)) return;
  if (prefs.mentionOnly && !mention) return;
  if (mention) navigator.vibrate?.([18, 60, 18]);
  if (localStorage.getItem(LS.SOUND) !== '0' && (document.visibilityState === 'hidden' || !atBottom || mention)) {
    playPing(mention);
  }
  if (document.visibilityState !== 'hidden') return;
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const body = m.content ? (m.content.length > 60 ? m.content.slice(0, 60) + '…' : m.content) : '画像を送信しました';
  const n = new Notification(mention ? `${m.sender_name}（あなた宛て）` : m.sender_name, { body, tag: 'line-chat' });
  n.onclick = () => { window.focus(); n.close(); };
}

function playPing(strong) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const notes = strong ? [880, 1174] : [988];
    notes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, now + i * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.16, now + i * 0.12 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.12 + 0.28);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now + i * 0.12);
      osc.stop(now + i * 0.12 + 0.3);
    });
  } catch (_) {  }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    unreadCount = 0;
    updateJumpButton();
    if (atBottom) markRead();
    unreadBoundary = null;
    supabase.from('users').update({ last_seen: new Date().toISOString() }).eq('dbid', myDbid).then(() => {});

});

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); toggleSearch(); return; }
  if (e.key === 'Escape') {
    if (lightbox.classList.contains('open')) { history.back(); return; }
    if (currentSheet) { closeSheet(); return; }
    if (document.querySelector('.action-menu')) { document.querySelector('.action-menu').remove(); return; }
    if (searchBar.classList.contains('open')) { closeSearch(); return; }
    if (editingId) { cancelEdit(); return; }
    if (replyTo) { cancelReply(); return; }
    if (pendingImage) { clearPendingImage(); return; }
  }
});

function showToast(text) {
  const t = el('div', text, 'toast');
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

setInterval(() => { if (document.visibilityState === 'visible') trackPresence(); }, 45000);
