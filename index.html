<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Simple Talk</title>
<style>
  html, body { height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100vw; height: 100dvh; border: none; display: block; }
  #fallback {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: rgba(0,0,0,.82); color: #fff; font-size: 13px; line-height: 1.7;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", Meiryo, sans-serif;
    text-align: center;
  }
  #fallback a { color: #7ef2a4; }
</style>
</head>
<body>
  <iframe
    id="frame"
    src="https://skrisr.github.io/st/"
    title="Simple Talk"
    allow="clipboard-read; clipboard-write; fullscreen; autoplay"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>

  <div id="fallback">
    うまく動かないときは
    <a href="https://skrisr.github.io/st/" target="_blank" rel="noopener">直接開く</a>
  </div>

  <script>
    var frame = document.getElementById('frame');
    var here = location.href.replace(/[?#].*$/, '').replace(/index\.html$/, '');
    var target = frame.src.replace(/[?#].*$/, '').replace(/index\.html$/, '');
    if (here === target) {
      frame.remove();
      document.getElementById('fallback').textContent =
        'このページ自身を読み込もうとしています。iframe の src を別の URL にしてください。';
    }
  </script>
</body>
</html>
