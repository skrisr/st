<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06c755">
<title>Simple Talk</title>
<meta property="og:title" content="Simple Talk">
<meta property="og:description" content="名前を入れるだけで参加できるチャット">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<style>
  :root{
    --line-green:#06c755;
    --line-green-dark:#05a648;
    --bg-chat:#e5ebee;
    --bg-panel:#ffffff;
    --bubble-mine:#8de24e;
    --bubble-mine-text:#093a00;
    --bubble-other:#ffffff;
    --bubble-other-text:#1a1a1a;
    --header-bg:#06c755;
    --header-text:#ffffff;
    --text-main:#1a1a1a;
    --text-sub:#8b98a1;
    --border:#e2e6e8;
    --field-bg:#ffffff;
    --field-border:#dfe3e6;
    --chip-bg:#f2f4f5;
    --overlay:rgba(0,0,0,.45);
    --quote-bg:rgba(0,0,0,.06);
    --danger:#e0433b;
    --header-h:56px;
    --font-scale:1;
    --dot:rgba(0,0,0,.045);
    --bg-dim:0;
    --radius:16px;
    --font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  }
  [data-theme="dark"]{
    --line-green:#06c755;
    --line-green-dark:#05a648;
    --bg-chat:#15171a;
    --bg-panel:#22262b;
    --bubble-mine:#2f6b3c;
    --bubble-mine-text:#eafce4;
    --bubble-other:#2b3037;
    --bubble-other-text:#e6e9ec;
    --header-bg:#1c1f23;
    --header-text:#f0f2f4;
    --text-main:#e6e9ec;
    --text-sub:#8f9aa3;
    --border:#33393f;
    --field-bg:#2b3037;
    --field-border:#3a4149;
    --chip-bg:#31373e;
    --overlay:rgba(0,0,0,.6);
    --quote-bg:rgba(255,255,255,.09);
    --danger:#ff7b73;
    --dot:rgba(255,255,255,.04);
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%; margin:0; padding:0;
    font-family:var(--font-family);
    background:var(--bg-chat);
    color:var(--text-main);
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
  }
  #app{ height:100dvh; display:flex; flex-direction:column; }
  button{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--line-green); outline-offset:2px; }
  @media (prefers-reduced-motion:reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }

  #gate{
    height:100dvh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,var(--line-green) 0%, var(--line-green-dark) 55%, #03823a 100%);
    padding:20px;
  }
  #gate .card{
    background:var(--bg-panel); width:100%; max-width:360px; border-radius:20px;
    padding:32px 26px; box-shadow:0 20px 50px rgba(0,0,0,.25); text-align:center;
  }
  #gate .logo{
    width:64px;height:64px;border-radius:18px;background:var(--line-green);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
    color:#fff;font-size:30px;font-weight:700;
  }
  #gate h1{ font-size:19px; margin:0 0 6px; color:var(--text-main);}
  #gate p.sub{ font-size:13px; color:var(--text-sub); margin:0 0 22px;}
  #gate input{
    width:100%; padding:13px 14px; border-radius:10px; border:1.5px solid var(--field-border);
    font-size:15px; outline:none; margin-bottom:10px; background:var(--field-bg); color:var(--text-main);
  }
  #gate input:focus{ border-color:var(--line-green); }
  #gate button{
    width:100%; padding:13px; border:none; border-radius:10px;
    background:var(--line-green); color:#fff; font-size:15px; font-weight:700;
    cursor:pointer; transition:opacity .15s;
  }
  #gate button:disabled{ opacity:.5; cursor:default; }
  #gate button:not(:disabled):active{ opacity:.8; }
  #gate .err{ color:var(--danger); font-size:12.5px; margin-top:8px; min-height:16px; }
  #gate .hint{ font-size:11px; color:var(--text-sub); margin-top:18px; line-height:1.6; }

  #chat{ display:flex; flex-direction:row; }
  #main{ flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; }
  #side{
    width:var(--side-w,260px); min-width:180px; max-width:60vw; flex-shrink:0;
    background:var(--bg-panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; min-height:0;
  }
  #side-head{
    height:var(--header-h); display:flex; align-items:center; justify-content:space-between;
    padding:0 6px 0 14px; background:var(--header-bg); color:var(--header-text);
    font-weight:700; font-size:15px; flex-shrink:0;
  }
  #side-head .icon-btn{ background:none;border:none;color:var(--header-text);font-size:17px;cursor:pointer;width:34px;height:34px;border-radius:50%; }
  #side-list{ flex:1; overflow-y:auto; padding:6px 0 20px; }
  .side-label{ font-size:10.5px; color:var(--text-sub); padding:10px 14px 4px; letter-spacing:.04em; }
  .side-item{
    display:flex; align-items:center; gap:10px; padding:9px 12px; cursor:pointer;
    border-left:3px solid transparent;
  }
  .side-item:hover{ background:var(--chip-bg); }
  .side-item.active{ background:var(--chip-bg); border-left-color:var(--line-green); }
  .side-item .avatar{ width:34px;height:34px;font-size:14px;margin:0; }
  .side-item .si-body{ flex:1; min-width:0; }
  .side-item .si-name{ font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .side-item .si-sub{ font-size:11px; color:var(--text-sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .side-item .si-badge{
    background:var(--danger); color:#fff; border-radius:10px; font-size:10.5px; font-weight:700;
    padding:1px 7px; flex-shrink:0;
  }
  .side-item .si-dot{ width:7px;height:7px;border-radius:50%;background:var(--line-green);flex-shrink:0; }
  #splitter{
    width:5px; flex-shrink:0; cursor:col-resize; background:var(--border);
    transition:background .15s;
  }
  #splitter:hover, #splitter.dragging{ background:var(--line-green); }
  #back-btn{ display:none; }

  @media (max-width:760px){
    #splitter{ display:none; }
    #side{
      position:absolute; inset:0; width:auto; max-width:none; z-index:20;
      border-right:none;
    }
    body.show-talk #side{ display:none; }
    body:not(.show-talk) #main{ display:none; }
    #back-btn{ display:flex; }
  }

  #header{
    height:var(--header-h); min-height:var(--header-h);
    background:var(--header-bg); color:var(--header-text); display:flex; align-items:center;
    padding:0 6px 0 12px; gap:6px; box-shadow:0 1px 4px rgba(0,0,0,.15); z-index:5;
  }
  #header .room-icon{
    width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.22);
    display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;
  }
  #header .titles{ flex:1; min-width:0; cursor:pointer; }
  #header .titles .name{ font-size:15.5px; font-weight:700; line-height:1.2; }
  #header .titles .members{ font-size:11px; opacity:.9; line-height:1.3; display:flex; align-items:center; gap:5px;}
  .conn-dot{ width:6px;height:6px;border-radius:50%;background:#7ef2a4; flex-shrink:0;}
  .conn-dot.off{ background:#ffb4b0; }
  #header button.icon-btn{
    background:none;border:none;color:var(--header-text);font-size:18px;cursor:pointer;
    width:36px;height:36px;border-radius:50%; display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  #header button.icon-btn:active{ background:rgba(255,255,255,.2); }

  #search-bar{
    display:none; background:var(--bg-panel); border-bottom:1px solid var(--border);
    padding:8px 10px; gap:8px; align-items:center; z-index:4;
  }
  #search-bar.open{ display:flex; }
  #search-input{
    flex:1; padding:9px 12px; border-radius:18px; border:1px solid var(--field-border);
    background:var(--field-bg); color:var(--text-main); font-size:14px; outline:none;
  }
  #search-input:focus{ border-color:var(--line-green); }
  #search-bar button{
    background:var(--chip-bg); border:none; color:var(--text-main); border-radius:16px;
    padding:8px 12px; font-size:12.5px; cursor:pointer;
  }
  #search-results{
    display:none; position:absolute; left:0; right:0; top:0; bottom:0; z-index:6;
    background:var(--bg-chat); overflow-y:auto; padding:8px 10px 30px;
  }
  #search-results.open{ display:block; }
  .sr-item{
    background:var(--bg-panel); border-radius:12px; padding:11px 13px; margin-bottom:8px;
    cursor:pointer; border:1px solid var(--border);
  }
  .sr-item:active{ opacity:.7; }
  .sr-head{ font-size:11.5px; color:var(--text-sub); display:flex; justify-content:space-between; gap:8px; margin-bottom:4px;}
  .sr-body{ font-size:13.5px; line-height:1.5; word-break:break-word; }
  .sr-body mark, .bubble mark{ background:#ffe680; color:#3a2c00; border-radius:3px; padding:0 1px;}
  [data-theme="dark"] .sr-body mark, [data-theme="dark"] .bubble mark{ background:#7a6320; color:#fff6d5; }
  .sr-empty{ text-align:center; color:var(--text-sub); font-size:13px; padding:40px 10px; line-height:1.8;}

  #pin-bar{
    display:none; align-items:center; gap:9px; padding:8px 12px;
    background:var(--bg-panel); border-bottom:1px solid var(--border); cursor:pointer;
  }
  #pin-bar.open{ display:flex; }
  #pin-bar .pin-icon{ flex-shrink:0; font-size:14px; }
  #pin-bar .pin-body{ flex:1; min-width:0; }
  #pin-bar .pin-name{ font-size:10.5px; color:var(--line-green); font-weight:700; }
  #pin-bar .pin-text{
    font-size:12.5px; color:var(--text-main);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  #chat-body{ flex:1; min-height:0; position:relative; display:flex; flex-direction:column; }
  #messages{
    flex:1; overflow-y:auto; padding:6px 10px 20px;
    display:flex; flex-direction:column; gap:2px;
    background-image: radial-gradient(var(--dot) 1px, transparent 1px);
    background-size:14px 14px;
    font-size:calc(14.5px * var(--font-scale));
  }
  body.has-bg #messages{
    background-image:
      linear-gradient(rgba(0,0,0,var(--bg-dim)), rgba(0,0,0,var(--bg-dim))),
      var(--bg-image);
    background-size:cover;
    background-position:center;
    background-attachment:local;
  }
  #top-sentinel{ height:1px; }
  .loading-older{ text-align:center; font-size:11.5px; color:var(--text-sub); padding:10px 0; }
  .day-sep{ text-align:center; margin:14px 0 8px; }
  .day-sep span{
    background:var(--quote-bg); color:var(--text-sub); font-size:11px; padding:3px 12px; border-radius:10px;
  }
  .unread-sep{ text-align:center; margin:14px 0 8px; position:relative; }
  .unread-sep::before{
    content:''; position:absolute; left:0; right:0; top:50%; height:1px; background:var(--danger); opacity:.45;
  }
  .unread-sep span{
    position:relative; background:var(--danger); color:#fff; font-size:10.5px; padding:3px 12px; border-radius:10px;
  }
  .msg-row{ display:flex; margin:5px 0; max-width:100%; align-items:flex-end; gap:6px; }
  .msg-row.mine{ justify-content:flex-end; }
  .msg-row.theirs{ justify-content:flex-start; }
  .msg-row.sending{ opacity:.55; }
  .msg-row.highlight .bubble{ animation:flash 1.6s ease; }
  @keyframes flash{
    0%,25%{ box-shadow:0 0 0 3px rgba(6,199,85,.55); }
    100%{ box-shadow:0 1px 1px rgba(0,0,0,.05); }
  }

  .avatar{
    width:32px;height:32px;border-radius:50%;background:#c9d2d8;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
    flex-shrink:0; margin-bottom:2px; user-select:none;
  }

  .bubble-col{ display:flex; flex-direction:column; max-width:74%; min-width:0; }
  .sender-name{ font-size:11.5px; color:var(--text-sub); margin:0 0 3px 3px; }

  .bubble-wrap{ display:flex; align-items:flex-end; gap:5px; }
  .msg-row.mine .bubble-wrap{ flex-direction:row-reverse; }

  .bubble{
    position:relative; padding:9px 12px; border-radius:var(--radius);
    line-height:1.55; word-break:break-word; overflow-wrap:anywhere; white-space:pre-wrap;
    box-shadow:0 1px 1px rgba(0,0,0,.05); cursor:default; -webkit-user-select:text;
  }
  .msg-row.theirs .bubble{
    background:var(--bubble-other); color:var(--bubble-other-text); border-bottom-left-radius:4px;
  }
  .msg-row.mine .bubble{
    background:var(--bubble-mine); color:var(--bubble-mine-text); border-bottom-right-radius:4px;
  }
  .msg-row.mentions-me .bubble{ box-shadow:0 0 0 2px var(--line-green); }
  .bubble a{ color:inherit; text-decoration:underline; text-underline-offset:2px; }
  .bubble code{
    background:var(--quote-bg); padding:1px 5px; border-radius:5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.9em;
  }
  .bubble del{ opacity:.65; }
  .bubble pre{
    background:var(--quote-bg); border-radius:8px; padding:8px 10px; margin:6px 0 2px;
    overflow-x:auto; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.86em; line-height:1.5; white-space:pre;
  }
  .bubble pre code{ background:none; padding:0; font-size:1em; }
  .bubble .mention{ font-weight:700; text-decoration:underline; text-underline-offset:2px; }

  .quote{
    display:block; background:var(--quote-bg); border-left:3px solid currentColor;
    border-radius:6px; padding:5px 8px; margin:-1px 0 7px; font-size:.86em; opacity:.85;
    cursor:pointer; max-height:4.2em; overflow:hidden;
  }
  .quote .q-name{ font-weight:700; display:block; margin-bottom:1px; }
  .quote .q-text{ display:block; white-space:pre-wrap; word-break:break-word; }

  .bubble .msg-image{
    display:block; max-width:min(240px,60vw); max-height:280px; width:auto; border-radius:10px;
    margin:2px 0 0; cursor:zoom-in; background:var(--quote-bg);
  }
  .bubble .msg-image + .msg-text{ display:block; margin-top:7px; }

  .meta{ display:flex; flex-direction:column; align-items:flex-end; gap:1px; margin-bottom:2px; flex-shrink:0;}
  .msg-row.theirs .meta{ align-items:flex-start; }
  .time{ font-size:10px; color:var(--text-sub); white-space:nowrap; }
  .read-mark{ font-size:10px; color:var(--text-sub); white-space:nowrap; }
  .edited-mark{ font-size:10px; color:var(--text-sub); }
  .more-btn{
    background:none;border:none;color:var(--text-sub); font-size:13px; cursor:pointer; padding:0 2px; line-height:1;
  }
  .retry-btn{ background:none;border:none;color:var(--danger); font-size:10.5px; cursor:pointer; padding:0;}

  .more-toggle{
    display:inline-block; margin-top:6px; font-size:.85em; font-weight:700;
    text-decoration:underline; cursor:pointer; opacity:.8;
  }

  .reactions{ display:flex; flex-wrap:wrap; gap:4px; margin:4px 0 0; }
  .msg-row.mine .reactions{ justify-content:flex-end; }
  .reaction{
    display:inline-flex; align-items:center; gap:3px; background:var(--bg-panel);
    border:1px solid var(--border); border-radius:12px; padding:1px 7px; font-size:11.5px;
    cursor:pointer; line-height:1.6; color:var(--text-main);
  }
  .reaction.by-me{ border-color:var(--line-green); background:rgba(6,199,85,.14); }
  .reaction .n{ font-size:10.5px; color:var(--text-sub); }
  .reaction.by-me .n{ color:var(--line-green-dark); font-weight:700; }
  [data-theme="dark"] .reaction.by-me .n{ color:#7ef2a4; }

  #typing{
    position:absolute; left:12px; bottom:6px; font-size:11.5px; color:var(--text-sub);
    background:var(--bg-panel); border:1px solid var(--border); border-radius:14px;
    padding:4px 10px; display:none; box-shadow:0 2px 6px rgba(0,0,0,.08); z-index:3;
  }
  #typing.show{ display:block; }
  #typing .dots span{ animation:blink 1.2s infinite; }
  #typing .dots span:nth-child(2){ animation-delay:.2s; }
  #typing .dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,60%,100%{opacity:.25} 30%{opacity:1} }

  #jump-btn{
    position:absolute; right:12px; bottom:14px; z-index:3; display:none;
    background:var(--line-green); color:#fff; border:none; border-radius:20px;
    padding:8px 14px; font-size:12.5px; font-weight:700; cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.25);
  }
  #jump-btn.show{ display:block; }
  #top-btn{
    position:absolute; right:12px; top:10px; z-index:3; display:none;
    background:var(--bg-panel); color:var(--text-main); border:1px solid var(--border);
    border-radius:50%; width:34px; height:34px; font-size:15px; cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  #top-btn.show{ display:block; }

  #reply-bar, #edit-bar{
    display:none; background:var(--bg-panel); border-top:1px solid var(--border);
    padding:8px 12px; align-items:center; gap:10px; font-size:12.5px;
  }
  #reply-bar.open, #edit-bar.open{ display:flex; }
  #reply-bar .bar-body, #edit-bar .bar-body{ flex:1; min-width:0; }
  #reply-bar .bar-label, #edit-bar .bar-label{ color:var(--line-green); font-weight:700; font-size:11.5px; }
  #reply-bar .bar-text, #edit-bar .bar-text{
    color:var(--text-sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .bar-close{ background:none;border:none;color:var(--text-sub);font-size:17px;cursor:pointer; }

  #image-bar{ display:none; background:var(--bg-panel); border-top:1px solid var(--border); padding:8px 12px; align-items:center; gap:10px;}
  #image-bar.open{ display:flex; }
  #image-bar img{ width:52px;height:52px;object-fit:cover;border-radius:8px; }
  #image-bar .img-name{ flex:1; font-size:12px; color:var(--text-sub); word-break:break-all; }

  #composer{
    background:var(--bg-panel); border-top:1px solid var(--border);
    display:flex; align-items:flex-end; gap:8px; padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  }
  #composer textarea{
    flex:1; resize:none; border:1px solid var(--field-border); border-radius:20px;
    padding:10px 14px; font-size:calc(14.5px * var(--font-scale)); max-height:120px; min-height:22px;
    line-height:1.4; outline:none; font-family:inherit; background:var(--field-bg); color:var(--text-main);
  }
  #composer textarea:focus{ border-color:var(--line-green); }
  .round-btn{
    width:42px;height:42px;border-radius:50%;border:none;background:var(--chip-bg);
    color:var(--text-main); font-size:18px; cursor:pointer; flex-shrink:0;
    display:flex;align-items:center;justify-content:center; transition:opacity .15s;
  }
  #send-btn{ background:var(--line-green); color:#fff; font-size:17px; }
  #send-btn:disabled{ opacity:.35; cursor:default; }
  #byte-counter{ font-size:10.5px; color:var(--text-sub); text-align:right; padding:0 14px 4px 0; background:var(--bg-panel);}
  #byte-counter.over{ color:var(--danger); font-weight:700; }
  #drop-hint{
    position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center;
    background:rgba(6,199,85,.16); border:3px dashed var(--line-green); color:var(--line-green-dark);
    font-size:16px; font-weight:700; pointer-events:none;
  }
  #drop-hint.show{ display:flex; }

  #mention-box{
    display:none; position:absolute; left:10px; right:10px; bottom:calc(100% + 4px);
    background:var(--bg-panel); border:1px solid var(--border); border-radius:12px;
    box-shadow:0 -4px 16px rgba(0,0,0,.15); max-height:180px; overflow-y:auto; z-index:8;
  }
  #mention-box.open{ display:block; }
  .mention-item{ padding:10px 13px; font-size:13.5px; cursor:pointer; display:flex; align-items:center; gap:9px;}
  .mention-item.active{ background:var(--chip-bg); }
  .mention-item .avatar{ width:26px;height:26px;font-size:11px;margin:0; }

  .modal-overlay{
    position:fixed; inset:0; background:var(--overlay); display:flex; align-items:flex-end;
    justify-content:center; z-index:50; animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  @keyframes slideUp{ from{transform:translateY(14px)} to{transform:translateY(0)} }
  .modal-sheet{
    position:relative; background:var(--bg-panel); width:100%; max-width:420px; border-radius:18px 18px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom)); max-height:82vh; overflow-y:auto;
    animation:slideUp .18s ease;
  }
  .modal-sheet h2{ font-size:16px; margin:0 0 16px; }
  .modal-sheet label{ font-size:12px; color:var(--text-sub); display:block; margin:16px 0 6px; }
  .modal-sheet input[type=text]{

function dmKey(a, b) { return 'dm:' + [String(a), String(b)].sort().join(':'); }
function isDm(ch) { return String(ch).startsWith('dm:'); }
function dmPartner(ch) {
  if (!isDm(ch)) return null;
  const [, a, b] = ch.split(':');
  return a === myDbid ? b : a;
}
function channelTitle(ch) {
  if (!isDm(ch)) return 'みんなの部屋';
  const p = dmPartner(ch);
  return (knownUsers.get(p) || {}).name || '不明な相手';
}

const PREF_KEY = 'line_chat_prefs';
const PREF_DEFAULTS = {
  enterSends: true, relTime: false, showSeconds: false, group: true,
  compact: false, hideAvatar: false, noDots: false, contrast: false,
  shortLinks: false, mentionOnly: false, muteUntil: 0, accent: '',
  jumbo: true, bgUrl: '', bgDim: 0, font: 'default', radius: 16, mineColor: '',
};
let prefs = { ...PREF_DEFAULTS, ...safeParse(localStorage.getItem(PREF_KEY), {}) };
function safeParse(v, fallback = {}) {
  try {
    const parsed = JSON.parse(v);
    return (parsed === null || parsed === undefined) ? fallback : parsed;
  } catch (_) { return fallback; }
}
function pref(k) { return prefs[k]; }
function setPref(k, v) { prefs[k] = v; localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); applyPrefs(); }
const FONT_STACKS = {
  default: '-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif',
  round: '"Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif',
  mincho: '"Hiragino Mincho ProN","Yu Mincho",serif',
  mono: 'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace',
};

function applyPrefs() {
  const root = document.documentElement;
  root.style.setProperty('--font-family', FONT_STACKS[prefs.font] || FONT_STACKS.default);
  root.style.setProperty('--radius', (prefs.radius ?? 16) + 'px');
  root.style.setProperty('--bg-dim', String(prefs.bgDim || 0));
  if (prefs.bgUrl) {
    root.style.setProperty('--bg-image', `url("${prefs.bgUrl.replace(/"/g, '%22')}")`);
    document.body.classList.add('has-bg');
  } else {
    document.body.classList.remove('has-bg');
  }
  if (prefs.mineColor) root.style.setProperty('--bubble-mine', prefs.mineColor);
  else root.style.removeProperty('--bubble-mine');
  document.body.classList.toggle('compact', !!prefs.compact);
  document.body.classList.toggle('hide-avatar', !!prefs.hideAvatar);
  document.body.classList.toggle('no-dots', !!prefs.noDots);
  document.body.classList.toggle('contrast', !!prefs.contrast);
  if (prefs.accent) {
    document.documentElement.style.setProperty('--line-green', prefs.accent);
    document.documentElement.style.setProperty('--header-bg', prefs.accent);
  } else {
    document.documentElement.style.removeProperty('--line-green');
    document.documentElement.style.removeProperty('--header-bg');
  }
}

async function init() {
  if (myDbid && myName) {
    const ok = await syncUserToServer(myDbid, myName);
    if (ok) { enterChat(); return; }
  }
  showGate();
}

function showGate() {
  gateEl.style.display = 'flex';
  chatEl.style.display = 'none';
  nameInput.value = myName || '';
  nameInput.focus();
}

enterBtn.addEventListener('click', handleEnter);
nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleEnter(); });

async function handleEnter() {
  const name = nameInput.value.trim();
  const real = $('#real-input').value.trim();
  gateErr.textContent = '';
  if (!real) { gateErr.textContent = '本名を入力してください。'; return; }
  if (!name) { gateErr.textContent = '表示名を入力してください。'; return; }
  if (name.length > 20) { gateErr.textContent = '表示名は20文字以内にしてください。'; return; }

  enterBtn.disabled = true; enterBtn.textContent = '確認中…';
  myReal = real;
  const newDbid = myDbid || crypto.randomUUID();
  const ok = await syncUserToServer(newDbid, name);
  enterBtn.disabled = false; enterBtn.textContent = 'はじめる';

  if (ok) {
    myDbid = newDbid;
    myName = name;
    localStorage.setItem(LS.DBID, myDbid);
    localStorage.setItem(LS.NAME, myName);
    localStorage.setItem('line_chat_real', myReal);
    enterChat();
  }
}

async function syncUserToServer(dbid, name) {
  myColor = colorForDbid(dbid);
  const payload = {
    dbid,
    display_name: name,
    avatar_color: myColor,
    last_seen: new Date().toISOString(),
    updated_at: new Date().toISOString(),
  };
  if (myReal) payload.real_name = myReal;
  let { error } = await supabase.from('users').upsert(payload, { onConflict: 'dbid' });
  if (error && /real_name/.test(error.message || '')) {
    delete payload.real_name;
    ({ error } = await supabase.from('users').upsert(payload, { onConflict: 'dbid' }));
  }

  if (error) {
    if (error.code === '23505') {
      gateErr.textContent = 'その表示名はすでに使われています。別の名前にしてください。';
    } else {
      gateErr.textContent = '接続エラー: ' + error.message;
    }
    return false;
  }
  return true;
}

function colorForDbid(dbid) {
  let h = 0;
  for (const ch of String(dbid)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}

async function enterChat() {
  gateEl.style.display = 'none';
  chatEl.style.display = 'flex';
  await loadUsers();
  await loadLatest();
  subscribeRealtime();
  subscribePresence();
  observeTopSentinel();
  updateByteCounter();
  applyPrefs();
  const draft = localStorage.getItem('line_chat_draft');
  if (draft) { textInput.value = draft; autoGrow(textInput); }
  $('#snippet-btn').addEventListener('click', openSnippets);
  checkPermalink();
  lastReadAt = reads[currentChannel] || lastReadAt;
  paintSide();
  loadChannelPreviews();
  if (window.innerWidth > 760) document.body.classList.add('show-talk');
  refreshStorageUsage();
  refreshDbUsage();
  loadPinned();
  setInterval(() => {
    if (document.visibilityState !== 'visible') return;
    refreshStorageUsage();
    refreshDbUsage();
  }, 120000);
}

async function refreshDbUsage() {
  const { data, error } = await supabase.rpc('db_usage');
  if (error || !data || !data.length) return;
  dbUsedBytes = Number(data[0].total_bytes) || 0;
  applyDbFullState();
}

function applyDbFullState() {
  const wasFull = dbFull;
  dbFull = dbUsedBytes >= (DB_LIMIT_BYTES - DB_SAFE_MARGIN);
  if (dbFull && !wasFull) showToast('データベースが上限に近づいています。新規送信を停止しました');
  textInput.disabled = dbFull;
  textInput.placeholder = dbFull ? 'データベースが満杯のため送信できません' : 'メッセージを入力';
  updateByteCounter();
}

async function loadUsers() {
  let { data } = await supabase.from('users').select('dbid, display_name, avatar_color, last_seen, real_name');
  if (!data) ({ data } = await supabase.from('users').select('dbid, display_name, avatar_color, last_seen'));
  if (!data) return;
  for (const u of data) {
    knownUsers.set(u.dbid, {
      name: u.display_name, real: u.real_name || '',
      color: u.avatar_color || colorForDbid(u.dbid), online: false,
    });
  }
}

async function loadLatest() {
  messagesEl.innerHTML = '<div class="empty-hint">読み込み中…</div>';
  const { data, error } = await supabase
    .from('messages').select('*')
    .eq('channel', currentChannel)
    .order('created_at', { ascending: false })
    .limit(PAGE_SIZE);

  if (error) {
    messagesEl.innerHTML = `<div class="empty-hint">読み込めませんでした。<br>${escapeHtml(error.message)}</div>`;
    return;
  }
  msgs = (data || []).slice().reverse();
  hasOlder = (data || []).length === PAGE_SIZE;
  msgById.clear();
  for (const m of msgs) msgById.set(mkey(m.id), m);
  await loadReactionsFor(msgs.map((m) => m.id));
  renderAll();
  scrollToBottom(true);
  markRead();
}

async function loadAround(target) {
  const [before, after] = await Promise.all([
    supabase.from('messages').select('*').eq('channel', currentChannel).lt('created_at', target.created_at)
      .order('created_at', { ascending: false }).limit(30),
    supabase.from('messages').select('*').eq('channel', currentChannel).gte('created_at', target.created_at)
      .order('created_at', { ascending: true }).limit(30),
  ]);
  const list = [...(before.data || []).reverse(), ...(after.data || [])];
  msgs = dedupe(list);
  hasOlder = (before.data || []).length === 30;
  msgById.clear();
  for (const m of msgs) msgById.set(mkey(m.id), m);
  await loadReactionsFor(msgs.map((m) => m.id));
  renderAll();
  focusMessage(target.id);
}

async function loadOlder() {
  if (loadingOlder || !hasOlder || !msgs.length) return;
  loadingOlder = true;
  const note = document.createElement('div');
  note.className = 'loading-older';
  note.textContent = '過去のメッセージを読み込み中…';
  messagesEl.insertBefore(note, messagesEl.firstChild.nextSibling);

  const { data } = await supabase.from('messages').select('*')
    .eq('channel', currentChannel)
    .lt('created_at', msgs[0].created_at)
    .order('created_at', { ascending: false })
    .limit(PAGE_SIZE);

  note.remove();
  const older = (data || []).slice().reverse();
  hasOlder = (data || []).length === PAGE_SIZE;
  if (older.length) {
    const prevHeight = messagesEl.scrollHeight;
    const prevTop = messagesEl.scrollTop;
    msgs = dedupe([...older, ...msgs]);
    for (const m of older) msgById.set(mkey(m.id), m);
    await loadReactionsFor(older.map((m) => m.id));
    renderAll();
    messagesEl.scrollTop = prevTop + (messagesEl.scrollHeight - prevHeight);
  }
  loadingOlder = false;
}

function dedupe(list) {
  const seen = new Set();
  return list.filter((m) => (seen.has(m.id) ? false : (seen.add(m.id), true)))
             .sort((a, b) => (a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : 0));
}

let topObserver = null;
function observeTopSentinel() {
  if (!topObserver) {
    topObserver = new IntersectionObserver((entries) => {
      if (entries.some((e) => e.isIntersecting)) loadOlder();
    }, { root: messagesEl, rootMargin: '120px' });
  }
  const sentinel = $('#top-sentinel');
  if (sentinel) topObserver.observe(sentinel);
}

async function loadReactionsFor(ids) {
  if (!ids.length) return;
  const { data } = await supabase.from('reactions').select('*').in('message_id', ids);
  for (const r of data || []) storeReaction(r);
}

function storeReaction(r) {
  reactionById.set(r.id, r);
  if (!reactionsByMsg.has(r.message_id)) reactionsByMsg.set(r.message_id, new Map());
  const byEmoji = reactionsByMsg.get(r.message_id);
  if (!byEmoji.has(r.emoji)) byEmoji.set(r.emoji, new Set());
  byEmoji.get(r.emoji).add(r.dbid);
}

function dropReaction(r) {
  reactionById.delete(r.id);
  const byEmoji = reactionsByMsg.get(r.message_id);
  if (!byEmoji) return;
  const set = byEmoji.get(r.emoji);
  if (!set) return;
  set.delete(r.dbid);
  if (!set.size) byEmoji.delete(r.emoji);
}

function subscribeRealtime() {
  if (dbChannel) supabase.removeChannel(dbChannel);
  dbChannel = supabase.channel('db-changes')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (p) => onInsert(p.new))
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, (p) => onUpdate(p.new))
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, (p) => onDelete(p.old))
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'reactions' }, (p) => {
      storeReaction(p.new);
      renderReactions(p.new.message_id);
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'reactions' }, (p) => {
      const known = reactionById.get(p.old.id) || p.old;
      if (!known || !known.message_id) return;
      dropReaction(known);
      renderReactions(known.message_id);
    })
    .subscribe((status) => { DBG.info('realtime', status); setConnected(status === 'SUBSCRIBED'); });
}

function onInsert(m) {
  const ch = m.channel || 'main';
  if (ch !== currentChannel) {
    if (isDm(ch) && !ch.includes(myDbid)) return;
    lastMsgByChannel.set(ch, m);
    if (m.sender_dbid !== myDbid) {
      unreadByChannel.set(ch, (unreadByChannel.get(ch) || 0) + 1);
      notifyIncoming(m);
    }
    paintSide();
    return;
  }
  if (m.client_id) {
    const temp = messagesEl.querySelector(`[data-client-id="${cssEscape(m.client_id)}"]`);
    if (temp) temp.remove();
    if (m.sender_dbid === myDbid) { lastSentId = m.id; lastSentAt = Date.now(); }
  }
  if (msgById.has(mkey(m.id))) return;
  lastMsgByChannel.set(ch, m);
  paintSide();
  msgById.set(mkey(m.id), m);
  msgs.push(m);
  const wasAtBottom = atBottom;
  appendRow(m);
  if (wasAtBottom) {
    scrollToBottom();
    markRead();
  } else if (m.sender_dbid !== myDbid) {
    unreadCount++;
    updateJumpButton();
  }
  if (m.sender_dbid !== myDbid) {
    notifyIncoming(m);
    clearTyping(m.sender_dbid);
  }
}

function onUpdate(m) {
  if (pinnedMsg && pinnedMsg.id === m.id) { pinnedMsg = m.pinned_at ? m : null; paintPinBar(); }
  const idx = msgs.findIndex((x) => x.id === m.id);
  if (idx >= 0) msgs[idx] = m;
  msgById.set(mkey(m.id), m);
  const row = rowOf(m.id);
  if (row) {
    const fresh = buildRow(m);
    row.replaceWith(fresh);
    renderReactions(m.id);
    updateReadReceipts();
  }
}

function onDelete(old) {
  if (!old || !old.id) return;
  if (pinnedMsg && pinnedMsg.id === old.id) { pinnedMsg = null; paintPinBar(); }
  msgs = msgs.filter((x) => x.id !== old.id);
  msgById.delete(mkey(old.id));
  const row = rowOf(old.id);
  if (row) row.remove();
}

function subscribePresence() {
  if (presenceChannel) supabase.removeChannel(presenceChannel);
  presenceChannel = supabase.channel('room:main-presence', {
    config: { presence: { key: myDbid }, broadcast: { self: false } },
  });
  presenceChannel
    .on('presence', { event: 'join' }, ({ newPresences }) => {
      for (const p of newPresences || []) {
        if (p.dbid && p.dbid !== myDbid && knownUsers.size) showToast(`${p.name}さんが参加しました`);
      }
    })
    .on('presence', { event: 'leave' }, ({ leftPresences }) => {
      for (const p of leftPresences || []) {
        if (p.dbid && p.dbid !== myDbid) showToast(`${p.name}さんが退出しました`);
      }
    })
    .on('presence', { event: 'sync' }, onPresenceSync)
    .on('broadcast', { event: 'typing' }, ({ payload }) => showTyping(payload))
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED') await trackPresence();
    });
}

async function trackPresence() {
  if (!presenceChannel) return;
  try {
    await presenceChannel.track({
      dbid: myDbid, name: myName, color: myColor || colorForDbid(myDbid),
      last_read_at: lastReadAt, channel: currentChannel, online_at: new Date().toISOString(),
    });
  } catch (_) {  }
}

function onPresenceSync() {
  const state = presenceChannel.presenceState();
  for (const u of knownUsers.values()) u.online = false;
  let count = 0;
  for (const key of Object.keys(state)) {
    const p = state[key][0];
    if (!p) continue;
    count++;
    const dbid = p.dbid || key;
    const prev = knownUsers.get(dbid) || {};
    knownUsers.set(dbid, { name: p.name || prev.name || '？', real: prev.real || '', color: p.color || colorForDbid(dbid), online: true, last_read_at: p.last_read_at, channel: p.channel });
  }
  if (!isDm(currentChannel)) memberTextEl.textContent = `${count}人が参加中`;
  updateReadReceipts();
  paintSide();
}

function setConnected(ok) {
  connDot.classList.toggle('off', !ok);
  if (!ok) memberTextEl.textContent = '接続していません';
}

window.addEventListener('online', async () => {
  setConnected(true);
  subscribeRealtime();
  subscribePresence();
  await refreshSince();
});
window.addEventListener('offline', () => setConnected(false));

async function refreshSince() {
  if (!msgs.length) { await loadLatest(); return; }
  const last = msgs[msgs.length - 1].created_at;
  const { data } = await supabase.from('messages').select('*')
    .eq('channel', currentChannel)
    .gt('created_at', last).order('created_at', { ascending: true }).limit(200);
  for (const m of data || []) onInsert(m);
}

function rowOf(id) { return messagesEl.querySelector(`[data-msg-id="${cssEscape(id)}"]`); }
function cssEscape(v) { return String(v).replace(/["\\]/g, '\\$&'); }

function renderAll() {
  messagesEl.innerHTML = '<div id="top-sentinel"></div>';
  observeTopSentinel();
  if (!msgs.length) {
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.innerHTML = 'まだメッセージはありません。<br>最初のひとことを送ってみましょう。';
    messagesEl.appendChild(hint);
    return;
  }
  let lastDay = null;
  let unreadShown = false;
  for (const m of msgs) {
    lastDay = maybeInsertDaySeparator(m.created_at, lastDay);
    if (!unreadShown && unreadBoundary && ts(m.created_at) > ts(unreadBoundary) && m.sender_dbid !== myDbid) {
      const sep = document.createElement('div');
      sep.className = 'unread-sep';
      sep.innerHTML = '<span>ここから未読</span>';
      messagesEl.appendChild(sep);
      unreadShown = true;
    }
    messagesEl.appendChild(buildRow(m));
  }
  updateReadReceipts();
}

function appendRow(m) {
  const hint = messagesEl.querySelector('.empty-hint');
  if (hint) hint.remove();
  const rows = messagesEl.querySelectorAll('.msg-row');
  const prev = rows[rows.length - 1];
  const prevDay = prev ? prev.dataset.day : null;
  maybeInsertDaySeparator(m.created_at, prevDay);
  messagesEl.appendChild(buildRow(m));
  updateReadReceipts();
}

function maybeInsertDaySeparator(iso, lastDay) {
  const day = dayLabel(iso);
  if (day !== lastDay) {
    const sep = document.createElement('div');
    sep.className = 'day-sep';
    sep.appendChild(el('span', day));
    messagesEl.appendChild(sep);
  }
  return day;
}

function dayLabel(iso) {
  const d = new Date(iso);
  const today = new Date();
  const yst = new Date(); yst.setDate(today.getDate() - 1);
  const same = (a, b) => a.toDateString() === b.toDateString();
  if (same(d, today)) return '今日';
  if (same(d, yst)) return '昨日';
  return d.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
}

function buildRow(m) {
  const mine = m.sender_dbid === myDbid;
  const row = document.createElement('div');
  row.className = 'msg-row ' + (mine ? 'mine' : 'theirs');
  row.dataset.msgId = m.id;
  row.dataset.day = dayLabel(m.created_at);
  if (m.client_id) row.dataset.clientId = m.client_id;
  if (m.__pending) row.classList.add('sending');
  if (!mine && mentionsMe(m.content)) row.classList.add('mentions-me');
  const prev = prevOf(m);
  if (prefs.group && prev && prev.sender_dbid === m.sender_dbid
      && dayLabel(prev.created_at) === row.dataset.day
      && ts(m.created_at) - ts(prev.created_at) < 5 * 60 * 1000) {
    row.classList.add('grouped');
  }

  const col = document.createElement('div');
  col.className = 'bubble-col';

  if (!mine) col.appendChild(el('div', m.sender_name, 'sender-name'));

  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';

  if (!mine) {
    const av = document.createElement('div');
    av.className = 'avatar';
    av.style.background = (knownUsers.get(m.sender_dbid) || {}).color || colorForDbid(m.sender_dbid);
    av.textContent = (m.sender_name || '?').trim().slice(0, 1).toUpperCase();
    wrap.appendChild(av);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  fillBubble(bubble, m);
  wrap.appendChild(bubble);

  const meta = document.createElement('div');
  meta.className = 'meta';
  if (mine && !m.__pending) meta.appendChild(el('div', '', 'read-mark'));
  meta.appendChild(el('div', m.__pending ? '🕘' : timeLabel(m.created_at), 'time'));
  if (m.edited_at) meta.appendChild(el('div', '編集済み', 'edited-mark'));
  if (bookmarks.has(String(m.id))) meta.appendChild(el('div', '⭐', 'star-mark'));
  if (m.__failed) {
    const retry = document.createElement('button');
    retry.className = 'retry-btn';
    retry.textContent = '再送';
    retry.addEventListener('click', () => retrySend(m));
    meta.appendChild(retry);
  } else if (!m.__pending) {
    const more = document.createElement('button');
    more.className = 'more-btn';
    more.textContent = '⋯';
    more.setAttribute('aria-label', 'メッセージの操作');
    more.addEventListener('click', (e) => { e.stopPropagation(); openActionMenu(m); });
    meta.appendChild(more);
  }
  wrap.appendChild(meta);

  col.appendChild(wrap);

  const rx = document.createElement('div');
  rx.className = 'reactions';
  rx.dataset.rxFor = m.id;
  col.appendChild(rx);

  row.appendChild(col);

  if (!m.__pending) {
    let timer = null;
    bubble.addEventListener('contextmenu', (e) => { e.preventDefault(); openActionMenu(m); });
    bubble.addEventListener('touchstart', () => {
      timer = setTimeout(() => { navigator.vibrate?.(12); openActionMenu(m); }, 450);
    }, { passive: true });
    ['touchend', 'touchmove', 'touchcancel'].forEach((ev) =>
      bubble.addEventListener(ev, () => clearTimeout(timer), { passive: true }));
  }

  queueMicrotask(() => renderReactions(m.id));
  return row;
}

function ts(iso) { return iso ? Date.parse(iso) : 0; }

function prevOf(m) {
  const i = msgs.findIndex((x) => x.id === m.id);
  return i > 0 ? msgs[i - 1] : null;
}

function timeLabel(iso) {
  if (prefs.relTime) return relTimeLabel(iso);
  const opt = { hour: '2-digit', minute: '2-digit' };
  if (prefs.showSeconds) opt.second = '2-digit';
  return new Date(iso).toLocaleTimeString('ja-JP', opt);
}

function relTimeLabel(iso) {
  const diff = Math.floor((Date.now() - ts(iso)) / 1000);
  if (diff < 60) return 'たった今';
  if (diff < 3600) return `${Math.floor(diff / 60)}分前`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}時間前`;
  return `${Math.floor(diff / 86400)}日前`;
}

function refreshTimeLabels() {
  if (!prefs.relTime) return;
  for (const row of messagesEl.querySelectorAll('.msg-row')) {
    const m = msgById.get(mkey(row.dataset.msgId));
    const t = row.querySelector('.time');
    if (m && t && !m.__pending) t.textContent = relTimeLabel(m.created_at);
  }
}
setInterval(refreshTimeLabels, 60000);

function el(tag, text, cls) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text) n.textContent = text;
  return n;
}

function fillBubble(bubble, m) {
  bubble.textContent = '';

  if (m.reply_to) {
    const src = msgById.get(mkey(m.reply_to));
    const q = document.createElement('div');
    q.className = 'quote';
    q.appendChild(el('span', src ? src.sender_name : '削除されたメッセージ', 'q-name'));
    q.appendChild(el('span', src ? previewOf(src) : '元のメッセージは見つかりません', 'q-text'));
    q.addEventListener('click', (e) => { e.stopPropagation(); jumpTo(m.reply_to); });
    bubble.appendChild(q);
  }

  if (m.image_url) {
    const looksImage = isImageName(m.file_name || m.image_url);
    if (looksImage) {
      const img = document.createElement('img');
      img.className = 'msg-image';
      img.loading = 'lazy';
      img.src = m.image_url;
      img.alt = m.file_name || '添付画像';
      img.addEventListener('click', (e) => { e.stopPropagation(); openLightbox(m.image_url); });
      bubble.appendChild(img);
    } else {
      const chip = document.createElement('a');
      chip.className = 'file-chip';
      chip.href = m.image_url;
      chip.target = '_blank';
      chip.rel = 'noopener noreferrer';
      chip.download = m.file_name || '';
      chip.addEventListener('click', (e) => e.stopPropagation());
      chip.appendChild(el('span', fileIcon(m.file_name), 'fi'));
      const fn = el('div', '', 'fn');
      fn.appendChild(el('b', m.file_name || 'ファイル'));
      fn.appendChild(el('span', humanSize(m.image_bytes) + ' ・ タップで開く'));
      chip.appendChild(fn);
      bubble.appendChild(chip);
    }
  }

  const content = m.content || '';
  if (!content) return;
  if (prefs.jumbo && !m.image_url && !m.reply_to && EMOJI_ONLY.test(content.trim())) {
    bubble.classList.add('jumbo');
    bubble.appendChild(document.createTextNode(content.trim()));
    return;
  }
  const holder = document.createElement('span');
  holder.className = 'msg-text';
  if (content.length <= COLLAPSE_LEN) {
    renderRichText(holder, content);
  } else {
    const short = content.slice(0, COLLAPSE_LEN);
    const body = document.createElement('span');
    renderRichText(body, short + '…');
    const toggle = el('div', `もっと見る（${content.length.toLocaleString()}文字）`, 'more-toggle');
    let expanded = false;
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      expanded = !expanded;
      body.textContent = '';
      renderRichText(body, expanded ? content : short + '…');
      toggle.textContent = expanded ? '閉じる' : `もっと見る（${content.length.toLocaleString()}文字）`;
    });
    holder.appendChild(body);
    holder.appendChild(toggle);
  }
  bubble.appendChild(holder);
}

function previewOf(m) {
  const t = (m.content || '').replace(/\s+/g, ' ').trim();
  if (t) return t.length > 60 ? t.slice(0, 60) + '…' : t;
  return m.image_url ? '画像' : '';
}

const RICH_RE = /(https?:\/\/[^\s<>"']+)|(@[^\s@]{1,20})|\|\|([^|]+)\|\||\*\*([^*]+)\*\*|(?<!\*)\*([^*\n]+)\*(?!\*)|~~([^~]+)~~|`([^`]+)`/g;

function renderRichText(target, text) {
  if (text.includes('```')) {
    const parts = text.split(/```/);
    parts.forEach((part, i) => {
      if (i % 2 === 1) {
        const wrap = el('div', '', 'code-wrap');
        const pre = document.createElement('pre');
        const code = part.replace(/^\n/, '');
        pre.appendChild(el('code', code));
        wrap.appendChild(pre);
        const cp = el('button', 'コピー', 'code-copy');
        cp.addEventListener('click', async (e) => {
          e.stopPropagation();
          await navigator.clipboard.writeText(code);
          cp.textContent = 'コピー済';
          setTimeout(() => { cp.textContent = 'コピー'; }, 1400);
        });
        wrap.appendChild(cp);
        target.appendChild(wrap);
      } else if (part) {
        renderBlocks(target, part);
      }
    });
    return;
  }
  renderBlocks(target, text);
}

function renderBlocks(target, text) {
  const lines = text.split('\n');
  let list = null;
  const flush = () => { if (list) { target.appendChild(list); list = null; } };
  for (const line of lines) {
    if (/^\s*[-*]\s+/.test(line)) {
      if (!list) list = document.createElement('ul');
      const li = document.createElement('li');
      renderInline(li, line.replace(/^\s*[-*]\s+/, ''));
      list.appendChild(li);
      continue;
    }
    flush();
    let mt = line.match(/^(#{1,3})\s+(.*)$/);
    if (mt) {
      const h = el('div', '', 'md-h' + mt[1].length);
      renderInline(h, mt[2]);
      target.appendChild(h);
      continue;
    }
    mt = line.match(/^>\s?(.*)$/);
    if (mt) {
      const q = el('div', '', 'md-quote');
      renderInline(q, mt[1]);
      target.appendChild(q);
      continue;
    }
    const div = el('div', '', 'md-line');
    if (line) renderInline(div, line);
    target.appendChild(div);
  }
  flush();
}

function renderInline(target, text) {
  let last = 0;
  for (const mt of text.matchAll(RICH_RE)) {
    if (mt.index > last) target.appendChild(document.createTextNode(text.slice(last, mt.index)));
    const [full, url, mention, spoiler, bold, italic, strike, code] = mt;
    if (url) {
      const a = document.createElement('a');
      a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.textContent = prefs.shortLinks ? shortenUrl(url) : url;
      a.title = url;
      target.appendChild(a);
    } else if (spoiler) {
      const sp = el('span', spoiler, 'spoiler');
      sp.addEventListener('click', (e) => { e.stopPropagation(); sp.classList.toggle('shown'); });
      target.appendChild(sp);
    } else if (mention) {
      const name = mention.slice(1);
      if (isKnownName(name)) {
        target.appendChild(el('span', mention, 'mention'));
      } else {
        target.appendChild(document.createTextNode(full));
      }
    } else if (bold) {
      target.appendChild(el('strong', bold));
    } else if (italic) {
      target.appendChild(el('em', italic));
    } else if (strike) {
      target.appendChild(el('del', strike));
    } else if (code) {
      target.appendChild(el('code', code));
    }
    last = mt.index + full.length;
  }
  if (last < text.length) target.appendChild(document.createTextNode(text.slice(last)));
}

function shortenUrl(url) {
  try {
    const u = new URL(url);
    const tail = u.pathname.length > 1 ? '/…' : '';
    return u.hostname.replace(/^www\./, '') + tail;
  } catch (_) { return url; }
}

const EMOJI_ONLY = /^(?:\p{Extended_Pictographic}|\uFE0F|\u200D|\s){1,10}$/u;

function isKnownName(name) {
  if (name === myName) return true;
  for (const u of knownUsers.values()) if (u.name === name) return true;
  return false;
}

function mentionsMe(content) {
  if (!content || !myName) return false;
  return content.includes('@' + myName);
}

function renderReactions(messageId) {
  const holder = messagesEl.querySelector(`[data-rx-for="${cssEscape(messageId)}"]`);
  if (!holder) return;
  holder.textContent = '';
  const byEmoji = reactionsByMsg.get(messageId);
  if (!byEmoji || !byEmoji.size) return;
  for (const [emoji, dbids] of byEmoji) {
    if (!dbids.size) continue;
    const chip = document.createElement('button');
    chip.className = 'reaction' + (dbids.has(myDbid) ? ' by-me' : '');
    chip.appendChild(document.createTextNode(emoji));
    chip.appendChild(el('span', String(dbids.size), 'n'));
    chip.title = [...dbids].map((d) => (knownUsers.get(d) || {}).name || '不明').join('、');
    chip.addEventListener('click', () => toggleReaction(messageId, emoji));
    holder.appendChild(chip);
  }
}

async function toggleReaction(messageId, emoji) {
  const set = reactionsByMsg.get(messageId)?.get(emoji);
  const mine = set && set.has(myDbid);
  if (mine) {
    for (const [id, r] of reactionById) {
      if (r.message_id === messageId && r.dbid === myDbid && r.emoji === emoji) { dropReaction({ ...r, id }); break; }
    }
    renderReactions(messageId);
    const { error } = await supabase.from('reactions').delete()
      .match({ message_id: messageId, dbid: myDbid, emoji });
    if (error) showToast('リアクションを外せませんでした');
  } else {
    const { data, error } = await supabase.from('reactions')
      .insert({ message_id: messageId, dbid: myDbid, emoji }).select().single();
    if (error) { showToast('リアクションを付けられませんでした'); return; }
    storeReaction(data);
    renderReactions(messageId);
  }
}

function updateReadReceipts() {
  const others = [...knownUsers.entries()]
    .filter(([d, u]) => u.online && d !== myDbid && (u.channel || 'main') === currentChannel);
  for (const row of messagesEl.querySelectorAll('.msg-row.mine')) {
    const m = msgById.get(mkey(row.dataset.msgId));
    const mark = row.querySelector('.read-mark');
    if (!m || !mark) continue;
    const n = others.filter(([, u]) => u.last_read_at && ts(u.last_read_at) >= ts(m.created_at)).length;
    mark.textContent = n > 0 ? `既読${others.length > 1 ? ' ' + n : ''}` : '';
  }
}

function markRead() {
  if (!msgs.length) return;
  const newest = msgs[msgs.length - 1].created_at;
  if (lastReadAt && ts(lastReadAt) >= ts(newest)) return;
  lastReadAt = newest;
  reads[currentChannel] = lastReadAt;
  localStorage.setItem('line_chat_reads', JSON.stringify(reads));
  localStorage.setItem(LS.LASTSEEN, lastReadAt);
  trackPresence();
}

function showTyping({ dbid, name, channel }) {
  if (!dbid || dbid === myDbid) return;
  if ((channel || 'main') !== currentChannel) return;
  clearTimeout(typingTimers.get(dbid)?.timer);
  typingTimers.set(dbid, { name, timer: setTimeout(() => clearTyping(dbid), 3200) });
  paintTyping();
}
function clearTyping(dbid) {
  const t = typingTimers.get(dbid);
  if (t) clearTimeout(t.timer);
  typingTimers.delete(dbid);
  paintTyping();
}
function paintTyping() {
  const names = [...typingTimers.values()].map((t) => t.name).filter(Boolean);
  if (!names.length) { typingEl.classList.remove('show'); return; }
  const label = names.length === 1 ? `${names[0]}さんが入力中` : `${names.length}人が入力中`;
  typingEl.textContent = '';
  typingEl.appendChild(document.createTextNode(label));
  const dots = el('span', '', 'dots');
  dots.innerHTML = '<span>・</span><span>・</span><span>・</span>';
  typingEl.appendChild(dots);
  typingEl.classList.add('show');
}
function sendTyping() {
  const now = Date.now();
  if (now - lastTypingSent < 1500 || !presenceChannel) return;
  lastTypingSent = now;
  presenceChannel.send({ type: 'broadcast', event: 'typing', payload: { dbid: myDbid, name: myName, channel: currentChannel } })
    .catch(() => {});
}

messagesEl.addEventListener('scroll', () => {
  const dist = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight;
  atBottom = dist < 80;
  if (atBottom) {
    unreadCount = 0;
    updateJumpButton();
    markRead();
  }
  $('#top-btn').classList.toggle('show', messagesEl.scrollTop > 600);
});

function scrollToBottom(instant) {
  requestAnimationFrame(() => {
    messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: instant ? 'auto' : 'smooth' });
    atBottom = true;
  });
}

function updateJumpButton() {
  if (unreadCount > 0) {
    jumpBtn.textContent = `新着 ${unreadCount}件 ↓`;
    jumpBtn.classList.add('show');
  } else if (!atBottom) {
    jumpBtn.textContent = '最新へ ↓';
    jumpBtn.classList.add('show');
  } else {
    jumpBtn.classList.remove('show');
  }
  updateTitleBadge();
}
$('#top-btn').addEventListener('click', () => messagesEl.scrollTo({ top: 0, behavior: 'smooth' }));
jumpBtn.addEventListener('click', () => { unreadCount = 0; scrollToBottom(); updateJumpButton(); markRead(); });

function totalUnread() {
  let n = unreadCount;
  for (const [ch, c] of unreadByChannel) if (ch !== currentChannel) n += c;
  return n;
}

function updateTitleBadge() {
  const n = totalUnread();
  document.title = n > 0 ? `(${n})Simple Talk` : 'Simple Talk';
  updateFavicon();
}

async function jumpTo(id) {
  if (msgById.has(mkey(id)) && rowOf(id)) { focusMessage(id); return; }
  const { data } = await supabase.from('messages').select('*').eq('id', id).maybeSingle();
  if (!data) { showToast('元のメッセージは見つかりませんでした'); return; }
  await loadAround(data);
}

function focusMessage(id) {
  const row = rowOf(id);
  if (!row) return;
  row.scrollIntoView({ block: 'center', behavior: 'smooth' });
  row.classList.remove('highlight');
  void row.offsetWidth;
  row.classList.add('highlight');
}

async function loadPinned() {
  const { data, error } = await supabase.from('messages').select('*')
    .eq('channel', currentChannel)
    .not('pinned_at', 'is', null)
    .order('pinned_at', { ascending: false })
    .limit(1);
  if (error) return;
  pinnedMsg = (data && data[0]) || null;
  paintPinBar();
}

function paintPinBar() {
  const bar = $('#pin-bar');
  if (!pinnedMsg) { bar.classList.remove('open'); return; }
  $('#pin-name').textContent = `${pinnedMsg.sender_name}さんのお知らせ`;
  $('#pin-text').textContent = previewOf(pinnedMsg) || '画像';
  bar.classList.add('open');
}

async function togglePin(m) {
  const isPinned = pinnedMsg && pinnedMsg.id === m.id;
  const { error } = await supabase.from('messages')
    .update({ pinned_at: isPinned ? null : new Date().toISOString() })
    .eq('id', m.id);
  if (error) { showToast('ピン留めできませんでした: ' + error.message); return; }
  showToast(isPinned ? 'ピン留めを外しました' : 'ピン留めしました');
  await loadPinned();
}

$('#pin-bar').addEventListener('click', (e) => {
  if (e.target.id === 'pin-unpin') return;
  if (pinnedMsg) jumpTo(pinnedMsg.id);
});
$('#pin-unpin').addEventListener('click', async (e) => {
  e.stopPropagation();
  if (pinnedMsg) await togglePin(pinnedMsg);
});

function openActionMenu(m) {
  const mine = m.sender_dbid === myDbid;
  const overlay = document.createElement('div');
  overlay.className = 'action-menu';
  const sheet = document.createElement('div');
  sheet.className = 'action-sheet';

  const quick = document.createElement('div');
  quick.className = 'quick-react';
  for (const emoji of QUICK_EMOJI) {
    const b = document.createElement('button');
    b.textContent = emoji;
    if (reactionsByMsg.get(m.id)?.get(emoji)?.has(myDbid)) b.classList.add('on');
    b.addEventListener('click', () => { toggleReaction(m.id, emoji); overlay.remove(); });
    quick.appendChild(b);
  }
  sheet.appendChild(quick);

  const add = (label, icon, fn, danger) => {
    const b = document.createElement('button');
    b.className = 'action-item' + (danger ? ' danger' : '');
    b.appendChild(el('span', icon));
    b.appendChild(el('span', label));
    b.addEventListener('click', () => { overlay.remove(); fn(); });
    sheet.appendChild(b);
  };

  add('返信する', '↩️', () => startReply(m));
  if (m.content) add('本文をコピー', '📋', async () => {
    await navigator.clipboard.writeText(m.content);
    showToast('コピーしました');
  });
  add('その他のリアクション', '😀', () => openEmojiPicker(m));
  add(bookmarks.has(String(m.id)) ? 'ブックマークを外す' : 'ブックマーク', '⭐', () => {
    const k = String(m.id);
    bookmarks.has(k) ? bookmarks.delete(k) : bookmarks.add(k);
    saveBookmarks();
    const row = rowOf(m.id);
    if (row) row.replaceWith(buildRow(m));
    showToast(bookmarks.has(k) ? 'ブックマークしました' : 'ブックマークを外しました');
  });
  add('リンクをコピー', '🔗', async () => {
    await navigator.clipboard.writeText(`${location.origin}${location.pathname}#m=${m.id}`);
    showToast('リンクをコピーしました');
  });
  add(pinnedMsg && pinnedMsg.id === m.id ? 'ピン留めを外す' : 'ピン留めする', '📌', () => togglePin(m));
  if (m.image_url && isImageName(m.file_name || m.image_url)) add('画像を開く', '🖼️', () => openLightbox(m.image_url));
  if (m.image_url && !isImageName(m.file_name || m.image_url)) add('ファイルを開く', '📎', () => window.open(m.image_url, '_blank', 'noopener'));
  if (mine && m.content) add('編集する', '✏️', () => startEdit(m));
  if (mine && m.image_url) add('添付だけ削除', '📎🗑️', () => deleteImageOnly(m), true);
  if (mine) add('削除する', '🗑️', () => deleteMessage(m.id), true);

  overlay.appendChild(sheet);
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
}

function openEmojiPicker(m) {
  const sheet = openSheet('リアクションを選ぶ');
  const grid = el('div', '', 'emoji-grid');
  for (const emoji of PICKER_EMOJI) {
    const b = el('button', emoji);
    if (reactionsByMsg.get(m.id)?.get(emoji)?.has(myDbid)) b.classList.add('on');
    b.addEventListener('click', () => { toggleReaction(m.id, emoji); closeSheet(); });
    grid.appendChild(b);
  }
  sheet.appendChild(grid);
}

function startReply(m) {
  cancelEdit();
  replyTo = m;
  $('#reply-label').textContent = `${m.sender_name}さんに返信`;
  $('#reply-text').textContent = previewOf(m) || '画像';
  $('#reply-bar').classList.add('open');
  textInput.focus();
}
function cancelReply() {
  replyTo = null;
  $('#reply-bar').classList.remove('open');
}
$('#reply-cancel').addEventListener('click', cancelReply);

function startEdit(m) {
  cancelReply();
  editingId = m.id;
  $('#edit-text').textContent = previewOf(m);
  $('#edit-bar').classList.add('open');
  textInput.value = m.content;
  autoGrow(textInput);

async function deleteImageOnly(m) {

async function deleteStorageObject(url, knownBytes) {
  const marker = `/object/public/${BUCKET}/`;
  const i = url.indexOf(marker);
  if (i < 0) return;
  const path = decodeURIComponent(url.slice(i + marker.length).split('?')[0]);
  const { error } = await supabase.storage.from(BUCKET).remove([path]);
  if (error) { console.warn('画像の削除に失敗:', error.message); return; }
  storageUsedBytes = Math.max(0, storageUsedBytes - (Number(knownBytes) || 0));
  applyStorageFullState();
}

  if (mentionBox.classList.contains('open') && ['ArrowDown', 'ArrowUp', 'Enter', 'Tab', 'Escape'].includes(e.key)) {
    if (handleMentionKey(e)) return;
  }
  if ((e.ctrlKey || e.metaKey) && !e.altKey) {
    const k = e.key.toLowerCase();
    if (k === 'b') { e.preventDefault(); wrapSelection('**', '**'); return; }
    if (k === 'i') { e.preventDefault(); wrapSelection('*', '*'); return; }
    if (k === 'e') { e.preventDefault(); wrapSelection('`', '`'); return; }
    if (k === 'x' && e.shiftKey) { e.preventDefault(); wrapSelection('~~', '~~'); return; }
    if (k === 'z' && !textInput.value) { e.preventDefault(); undoLastSend(); return; }
  }
  const enterSubmits = prefs.enterSends ? (!e.shiftKey) : (e.ctrlKey || e.metaKey);
  if (e.key === 'Enter' && enterSubmits && !e.isComposing) {
    e.preventDefault();
    submit();
  } else if (e.key === 'ArrowUp' && !textInput.value && !editingId) {
    const last = [...msgs].reverse().find((m) => m.sender_dbid === myDbid && m.content);
    if (last) { e.preventDefault(); startEdit(last); }
  }
});

function wrapSelection(before, after) {
  const a = textInput.selectionStart, b = textInput.selectionEnd;
  const v = textInput.value;
  textInput.value = v.slice(0, a) + before + v.slice(a, b) + after + v.slice(b);
  textInput.focus();
  textInput.setSelectionRange(a + before.length, b + before.length);
  autoGrow(textInput);
  updateByteCounter();
}

async function submit() {
  if (editingId) return saveEdit();

function handleSlashCommand(line) {
  const [cmd, ...rest] = line.split(/\s+/);
  const arg = rest.join(' ');
  const clear = () => { textInput.value = ''; autoGrow(textInput); updateByteCounter(); localStorage.removeItem('line_chat_draft'); };
  switch (cmd) {
    case '/help':
      clear();
      showToast('/shrug /tableflip /me /theme /clear /top /bottom /search');
      return true;
    case '/shrug':      textInput.value = (arg ? arg + ' ' : '') + '¯\\_(ツ)_/¯'; sendMessage(); return true;
    case '/tableflip':  textInput.value = (arg ? arg + ' ' : '') + '(╯°□°）╯︵ ┻━┻'; sendMessage(); return true;
    case '/me':         if (!arg) return true; textInput.value = `*${myName} ${arg}*`; sendMessage(); return true;
    case '/theme':
      clear();
      if (['light', 'dark', 'system'].includes(arg)) { localStorage.setItem(LS.THEME, arg); applyTheme(); showToast('テーマを変えました'); }
      else showToast('/theme light | dark | system');
      return true;
    case '/clear':      clear(); return true;
    case '/top':        clear(); messagesEl.scrollTo({ top: 0, behavior: 'smooth' }); return true;
    case '/bottom':     clear(); scrollToBottom(); return true;
    case '/search':     clear(); toggleSearch(); if (arg) { searchInput.value = arg; runSearch(); } return true;
    default: return false;
  }
}

async function sendMessage() {
  DBG.info('sendMessage', { channel: currentChannel, len: textInput.value.length, file: pendingImage?.name || null });
  const content = textInput.value;
  if (!content.trim() && !pendingImage) return;
  if (dbFull) { showToast('データベースが満杯のため送信できません'); return; }
  if (currentByteLength() > MAX_BYTES) { showToast('本文が大きすぎます（上限1024KB）'); return; }

  const clientId = crypto.randomUUID();
  const draft = {
    id: 'temp-' + clientId,
    client_id: clientId,
    sender_dbid: myDbid,
    sender_name: myName,
    content,
    reply_to: replyTo ? replyTo.id : null,
    image_url: null,
    created_at: new Date().toISOString(),
    __pending: true,
  };

  appendRow(draft);
  scrollToBottom();
  const file = pendingImage;
  textInput.value = '';
  autoGrow(textInput);
  clearPendingImage();
  const replySnapshot = replyTo;
  cancelReply();
  updateByteCounter();

  let imageUrl = null;
  if (file) {
    imageUrl = await uploadImage(file, draft);
    if (imageUrl === false) return;
  }

  localStorage.removeItem('line_chat_draft');
  const { error } = await supabase.from('messages').insert({
    sender_dbid: myDbid,
    sender_name: myName,
    content,
    reply_to: replySnapshot ? replySnapshot.id : null,
    image_url: imageUrl,
    image_bytes: file ? file.size : null,
    file_name: file ? file.name : null,
    client_id: clientId,
    channel: currentChannel,
  });

  if (error) {
    markDraftFailed(draft, error.message);
    return;
  }
  setTimeout(() => {
    const stale = messagesEl.querySelector(`[data-client-id="${cssEscape(clientId)}"].sending`);
    if (stale) refreshSince();
  }, 2500);
}

function markDraftFailed(draft, message) {
  const row = messagesEl.querySelector(`[data-client-id="${cssEscape(draft.client_id)}"]`);
  draft.__pending = false;
  draft.__failed = true;
  if (row) row.replaceWith(buildRow(draft));
  showToast('送信できませんでした: ' + message);
}

async function retrySend(draft) {
  const row = messagesEl.querySelector(`[data-client-id="${cssEscape(draft.client_id)}"]`);
  if (row) row.remove();
  textInput.value = draft.content || '';
  autoGrow(textInput);
  updateByteCounter();
  await sendMessage();
}

async function setPendingImage(file) {
  if (storageFull) { showToast('ストレージが満杯に近いため、いまは画像を送れません'); return; }
  if (file.size > MAX_IMAGE_BYTES) { showToast('ファイルは5MBまでです'); return; }

  pendingImage = shrunk;
  const thumb = $('#image-thumb');

  }
  $('#image-name').textContent = (isImg && shrunk.size < original * 0.95)
    ? `${file.name}（${humanSize(original)} → ${humanSize(shrunk.size)} に圧縮）`
    : `${fileIcon(file.name)} ${file.name}（${humanSize(shrunk.size)}）`;

async function shrinkImage(file) {
  if (file.type === 'image/gif') return file;
  try {
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, IMAGE_MAX_EDGE / Math.max(bitmap.width, bitmap.height));
    const w = Math.round(bitmap.width * scale);
    const h = Math.round(bitmap.height * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(bitmap, 0, 0, w, h);
    bitmap.close?.();
    const blob = await new Promise((res) => canvas.toBlob(res, 'image/jpeg', IMAGE_QUALITY));
    if (!blob || blob.size >= file.size) return file;
    const name = file.name.replace(/\.[^.]+$/, '') + '.jpg';
    return new File([blob], name, { type: 'image/jpeg' });
  } catch (_) {
    return file;
  }
}

function applyStorageFullState() {
  const wasFull = storageFull;
  storageFull = storageUsedBytes >= (STORAGE_LIMIT_BYTES - STORAGE_SAFE_MARGIN);
  const btn = $('#attach-btn');

  btn.title = storageFull ? 'ストレージが満杯のため画像は送れません' : '画像を送る';

  if (storageFull && !wasFull) {

}

async function uploadImage(file, draft) {
  const ext = (file.name.split('.').pop() || 'png').toLowerCase().slice(0, 5);
  const path = `${myDbid}/${Date.now()}-${crypto.randomUUID().slice(0, 8)}.${ext}`;
  const { error } = await supabase.storage.from(BUCKET).upload(path, file, {
    cacheControl: '31536000', contentType: file.type, upsert: false,
  });
  if (error) {
    markDraftFailed(draft, error.message + '（schema.sql の Storage 設定を実行してください）');
    return false;
  }
  storageUsedBytes += file.size;
  applyStorageFullState();
  return supabase.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

let mentionCandidates = [];
let mentionIndex = 0;

function currentMentionQuery() {
  const pos = textInput.selectionStart;
  const before = textInput.value.slice(0, pos);
  const mt = before.match(/(?:^|\s)@([^\s@]{0,20})$/);
  return mt ? { query: mt[1], start: pos - mt[1].length - 1, end: pos } : null;
}

function updateMentionBox() {
  const ctx = currentMentionQuery();
  if (!ctx) { mentionBox.classList.remove('open'); return; }
  const q = ctx.query.toLowerCase();
  mentionCandidates = [...knownUsers.entries()]
    .filter(([d, u]) => d !== myDbid && u.name && u.name.toLowerCase().includes(q))
    .sort((a, b) => Number(b[1].online) - Number(a[1].online))
    .slice(0, 6);
  if (!mentionCandidates.length) { mentionBox.classList.remove('open'); return; }
  mentionIndex = 0;
  paintMentionBox();
  mentionBox.classList.add('open');
}

function paintMentionBox() {
  mentionBox.textContent = '';
  mentionCandidates.forEach(([dbid, u], i) => {
    const item = document.createElement('div');
    item.className = 'mention-item' + (i === mentionIndex ? ' active' : '');
    const av = el('div', (u.name || '?').slice(0, 1).toUpperCase(), 'avatar');
    av.style.background = u.color || colorForDbid(dbid);
    item.appendChild(av);
    item.appendChild(el('span', u.name));
    if (u.online) item.appendChild(el('span', 'オンライン', 'badge'));
    item.addEventListener('mousedown', (e) => { e.preventDefault(); applyMention(i); });
    mentionBox.appendChild(item);
  });
}

function handleMentionKey(e) {
  if (e.key === 'Escape') { mentionBox.classList.remove('open'); e.preventDefault(); return true; }
  if (e.key === 'ArrowDown') { mentionIndex = (mentionIndex + 1) % mentionCandidates.length; paintMentionBox(); e.preventDefault(); return true; }
  if (e.key === 'ArrowUp') { mentionIndex = (mentionIndex - 1 + mentionCandidates.length) % mentionCandidates.length; paintMentionBox(); e.preventDefault(); return true; }
  if (e.key === 'Enter' || e.key === 'Tab') { applyMention(mentionIndex); e.preventDefault(); return true; }
  return false;
}

function applyMention(i) {
  const ctx = currentMentionQuery();
  const pick = mentionCandidates[i];
  if (!ctx || !pick) return;
  const name = pick[1].name;
  const v = textInput.value;
  textInput.value = v.slice(0, ctx.start) + '@' + name + ' ' + v.slice(ctx.end);
  const caret = ctx.start + name.length + 2;
  textInput.setSelectionRange(caret, caret);
  mentionBox.classList.remove('open');
  textInput.focus();
  updateByteCounter();
}

async function runSearch() {
  const q = searchInput.value.trim();
  if (q.length < 1) { searchResults.classList.remove('open'); return; }
  const token = ++searchAbort;
  searchResults.classList.add('open');
  searchResults.innerHTML = '<div class="sr-empty">検索中…</div>';

  const pattern = '%' + q.replace(/[%_]/g, (c) => '\\' + c) + '%';
  let query = supabase.from('messages').select('*').eq('channel', currentChannel).ilike('content', pattern);
  if (searchFilterMine) query = query.eq('sender_dbid', myDbid);
  if (searchFilterImage) query = query.not('image_url', 'is', null);
  const { data, error } = await query.order('created_at', { ascending: false }).limit(50);
  if (q) rememberSearch(q);

  if (token !== searchAbort) return;
  if (error) { searchResults.innerHTML = `<div class="sr-empty">検索できませんでした<br>${escapeHtml(error.message)}</div>`; return; }
  if (!data.length) { searchResults.innerHTML = '<div class="sr-empty">見つかりませんでした。<br>別のことばで試してみてください。</div>'; return; }

  searchResults.textContent = '';
  const head = el('div', `${data.length}件${data.length === 50 ? '以上' : ''}見つかりました`, 'sr-empty');
  head.style.padding = '4px 4px 10px';
  searchResults.appendChild(head);

  for (const m of data) {
    const item = document.createElement('div');
    item.className = 'sr-item';
    const h = document.createElement('div');
    h.className = 'sr-head';
    h.appendChild(el('span', m.sender_name));
    h.appendChild(el('span', `${dayLabel(m.created_at)} ${timeLabel(m.created_at)}`));
    item.appendChild(h);
    const body = el('div', '', 'sr-body');
    highlightInto(body, snippetAround(m.content, q), q);
    item.appendChild(body);
    item.addEventListener('click', async () => {
      closeSearch();
      await jumpTo(m.id);
    });
    searchResults.appendChild(item);
  }
}

function snippetAround(content, q) {
  const text = (content || '').replace(/\s+/g, ' ');
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return text.slice(0, 120);
  const from = Math.max(0, i - 40);
  return (from > 0 ? '…' : '') + text.slice(from, from + 140) + (from + 140 < text.length ? '…' : '');
}

function highlightInto(target, text, q) {
  const lower = text.toLowerCase();
  const needle = q.toLowerCase();
  let pos = 0;
  while (true) {
    const i = lower.indexOf(needle, pos);
    if (i < 0 || !needle) break;
    target.appendChild(document.createTextNode(text.slice(pos, i)));
    target.appendChild(el('mark', text.slice(i, i + needle.length)));
    pos = i + needle.length;
  }
  target.appendChild(document.createTextNode(text.slice(pos)));
}

function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

let currentSheet = null;
function openSheet(title) {
  closeSheet();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const sheet = document.createElement('div');
  sheet.className = 'modal-sheet';
  const x = el('button', '✕', 'close-x');
  x.setAttribute('aria-label', '閉じる');
  x.addEventListener('click', closeSheet);
  sheet.appendChild(x);
  sheet.appendChild(el('h2', title));
  overlay.appendChild(sheet);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSheet(); });
  document.body.appendChild(overlay);
  currentSheet = overlay;
  return sheet;
}
function closeSheet() {
  if (currentSheet) currentSheet.remove();
  currentSheet = null;
}

function segmented(options, value, onPick) {
  const box = el('div', '', 'seg');
  for (const [val, label] of options) {
    const b = el('button', label);
    if (val === value) b.classList.add('on');
    b.addEventListener('click', () => {
      box.querySelectorAll('button').forEach((n) => n.classList.remove('on'));
      b.classList.add('on');
      onPick(val);
    });
    box.appendChild(b);
  }
  return box;
}

function switchRow(label, on, onToggle) {
  const row = el('div', '', 'switch-row');
  row.appendChild(el('span', label));
  const sw = el('div', '', 'switch' + (on ? ' on' : ''));
  sw.setAttribute('role', 'switch');
  sw.tabIndex = 0;
  const flip = () => {
    on = !on;
    sw.classList.toggle('on', on);
    onToggle(on);
  };
  sw.addEventListener('click', flip);
  sw.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
  row.appendChild(sw);
  return row;
}


function paintSide() {
  const list = $('#side-list');
  list.textContent = '';

  list.appendChild(el('div', 'ルーム', 'side-label'));
  list.appendChild(sideItem({
    key: 'main', icon: '👥', color: '#06c755', name: 'みんなの部屋',
    sub: previewOfChannel('main'),
  }));

  list.appendChild(el('div', 'ダイレクトメッセージ', 'side-label'));
  const people = [...knownUsers.entries()]
    .filter(([d]) => d !== myDbid)
    .sort((a, b) => Number(b[1].online) - Number(a[1].online) || String(a[1].name).localeCompare(String(b[1].name), 'ja'));

  if (!people.length) {
    list.appendChild(el('div', 'まだ他の参加者がいません', 'sr-empty'));
    return;
  }
  for (const [dbid, u] of people) {

      online: u.online,
    }));
  }
}

}

async function switchChannel(ch) {
  DBG.info('switchChannel', ch);
  document.body.classList.add('show-talk');
  if (ch === currentChannel) { paintSide(); return; }
  reads[currentChannel] = lastReadAt;
  localStorage.setItem('line_chat_reads', JSON.stringify(reads));

  currentChannel = ch;
  unreadByChannel.set(ch, 0);
  unreadCount = 0;
  lastReadAt = reads[ch] || null;
  unreadBoundary = lastReadAt;
  replyTo = null; cancelEdit(); clearPendingImage();
  $('#reply-bar').classList.remove('open');
  closeSearch();

  const dm = isDm(ch);
  $('#room-title').textContent = channelTitle(ch);
  $('#room-icon').textContent = dm ? (channelTitle(ch) || '?').slice(0, 1).toUpperCase() : '👥';
  $('#room-icon').style.background = dm ? colorForDbid(dmPartner(ch)) : '';
  $('#member-text').textContent = dm ? '1対1のトーク' : '接続中…';
  textInput.placeholder = dm ? `${channelTitle(ch)}さんへメッセージ` : 'メッセージを入力';

  paintSide();
  updateJumpButton();
  await loadLatest();
  await loadPinned();
}

(function setupSplitter() {
  const sp = $('#splitter');
  let dragging = false;
  const move = (x) => {
    const w = Math.max(180, Math.min(window.innerWidth * 0.6, x));
    document.documentElement.style.setProperty('--side-w', w + 'px');
    localStorage.setItem('line_chat_sidew', String(w));
  };
  const saved = localStorage.getItem('line_chat_sidew');
  if (saved) document.documentElement.style.setProperty('--side-w', saved + 'px');
  sp.addEventListener('mousedown', (e) => { dragging = true; sp.classList.add('dragging'); e.preventDefault(); });
  window.addEventListener('mousemove', (e) => { if (dragging) move(e.clientX); });
  window.addEventListener('mouseup', () => { dragging = false; sp.classList.remove('dragging'); });
  sp.addEventListener('touchstart', () => { dragging = true; }, { passive: true });
  window.addEventListener('touchmove', (e) => { if (dragging) move(e.touches[0].clientX); }, { passive: true });
  window.addEventListener('touchend', () => { dragging = false; });
})();

async function loadChannelPreviews() {
  const { data } = await supabase.from('messages').select('*')
    .order('created_at', { ascending: false }).limit(300);
  for (const m of data || []) {
    const ch = m.channel || 'main';
    if (isDm(ch) && !ch.includes(myDbid)) continue;
    if (!lastMsgByChannel.has(ch)) lastMsgByChannel.set(ch, m);
    if (ch !== currentChannel && m.sender_dbid !== myDbid) {
      const seen = reads[ch];
      if (!seen || ts(m.created_at) > ts(seen)) {
        unreadByChannel.set(ch, (unreadByChannel.get(ch) || 0) + 1);
      }
    }
  }
  paintSide();
  updateTitleBadge();
}

  sheet.appendChild(row);

  const filterRow = el('div', '', 'chip-row');
  filterRow.style.padding = '6px 0 0';
  let filter = 'all';
  const list = document.createElement('div');
  list.id = 'dbg-list';
  const paint = () => {
    list.textContent = '';
    for (const e of DBG.buf) {
      if (filter !== 'all' && e.level !== filter) continue;
      list.appendChild(DBG.row(e));
    }
    list.scrollTop = list.scrollHeight;
  };
  for (const [key, label] of [['all', 'すべて'], ['error', 'エラー'], ['warn', '警告'], ['ok', '成功'], ['info', '情報']]) {
    const c = el('button', label, 'chip' + (key === 'all' ? ' on' : ''));
    c.addEventListener('click', () => {
      filter = key;
      filterRow.querySelectorAll('.chip').forEach((n) => n.classList.remove('on'));
      c.classList.add('on');
      paint();
    });
    filterRow.appendChild(c);
  }
  sheet.appendChild(filterRow);
  sheet.appendChild(list);
  paint();
}

function openBookmarks() {
  const sheet = openSheet('ブックマーク');
  const ids = [...bookmarks];
  if (!ids.length) { sheet.appendChild(el('div', 'まだありません。メッセージのメニューから追加できます。', 'sr-empty')); return; }
  const list = el('div', '', 'people-list');
  sheet.appendChild(list);
  (async () => {
    const { data } = await supabase.from('messages').select('*').in('id', ids)
      .order('created_at', { ascending: false });
    list.textContent = '';
    for (const m of data || []) {
      const item = el('div', '', 'sr-item');
      const h = el('div', '', 'sr-head');
      h.appendChild(el('span', m.sender_name));
      h.appendChild(el('span', `${dayLabel(m.created_at)} ${timeLabel(m.created_at)}`));

function openGallery() {
  const sheet = openSheet('画像一覧');
  const grid = el('div', '', 'gallery');
  sheet.appendChild(grid);
  (async () => {
    const { data } = await supabase.from('messages').select('id,image_url,created_at,sender_name')
      .not('image_url', 'is', null).order('created_at', { ascending: false }).limit(200);

function openDateJump() {
  const sheet = openSheet('日付にジャンプ');
  const input = document.createElement('input');
  input.type = 'date';
  input.style.cssText = 'width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--field-border);background:var(--field-bg);color:var(--text-main);font-size:14px;';
  sheet.appendChild(input);
  const go = el('button', 'その日へ移動', 'row-btn primary');

    const { data } = await supabase.from('messages').select('*')
      .gte('created_at', new Date(input.value + 'T00:00:00').toISOString())
      .order('created_at', { ascending: true }).limit(1);
    closeSheet();

    await loadAround(data[0]);
  });
  sheet.appendChild(go);
