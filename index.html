というわけで、中身は普通に解析できます。これは以下のようなアプリです。

## 内容の要約

**目的**: Supabaseを使った、LINE風のシンプルな1部屋チャットアプリ（`chat.html`）

**主な仕組み**:
- 名前を入力するだけで入室（アカウント登録不要）
- 初回入室時に`crypto.randomUUID()`で「dbid」という一意なIDを発行し、`localStorage`に保存
- 表示名はサーバー側で重複禁止（`UNIQUE`制約＋エラーハンドリング）
- メッセージの送受信・削除がリアルタイム反映（Supabase Realtimeのpostgres_changesを購読）
- オンライン人数もPresence機能でリアルタイム表示
- 本文は最大1024KB（1,048,576バイト）まで、300文字超は折りたたみ表示
- 非アクティブタブでの新着通知（Notification API）
- IDや表示名を後から変更・再発行できる設定パネルあり

**SupabaseのURL/キーの難読化について**:
```javascript
function deobfuscate(scrambled) {
  const b64 = scrambled.split('').reverse().join('');
  return atob(b64);
}
```
これは「文字列を反転→Base64デコード」するだけの単純な処理です。実際にデコードすると、SupabaseのプロジェクトURLと`anon`（publishable）キーが復元されます。

⚠️ **重要な注意点**: このBase64＋反転は「難読化」であって「暗号化」ではありません。ブラウザの開発者ツールで`deobfuscate`関数をコンソールから直接呼び出せば誰でも一瞬で元の値に戻せます。コメントにも書かれている通り、anon keyはもともとクライアントに公開される前提の鍵なので実害は小さいですが、これを「秘匿できている」と誤解しない方がいいです。セキュリティは各テーブルのRLS（Row Level Security）ポリシー側できちんと担保する必要があります（このコード自体は「削除ボタンの表示」をクライアント側で制御しているだけで、DB側のRLSは「オープン」とコメントに書かれているので、実質誰でも他人のメッセージを削除・改変できる状態です）。

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* ============================================================
   接続情報の復号（難読化解除）
   ------------------------------------------------------------
   Base64エンコード → 文字列反転、の順で難読化して埋め込んである値を
   実行時に「反転 → Base64デコード」して元に戻す。
   ※publishable keyはブラウザに公開される前提の鍵だが、
     ソース上に平文で置かないという指示のため難読化している。
   ============================================================ */
function deobfuscate(scrambled) {
  const b64 = scrambled.split('').reverse().join('');
  return atob(b64);
}
const SUPABASE_URL = deobfuscate('==wbj5SZzFmYhBXdz5yYjhWa0pmezdWarJme4hGZ4dXd59yL6MHc0RHa');
const SUPABASE_KEY = deobfuscate('==QRBV2MuZVYo91Z6JGeGl0SQx0ZQRWd2FmdR5mTSZWVfVGbiFGazlGbiVHcfJ2c');

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============================================================
   定数・状態
   ============================================================ */
const LS_DBID = 'line_chat_dbid';
const LS_NAME = 'line_chat_name';
const MAX_BYTES = 1024 * 1024; // 1024KB = 1,048,576 バイト
const COLLAPSE_LEN = 300;      // これを超える文字数の本文は折りたたむ

let myDbid = localStorage.getItem(LS_DBID);
let myName = localStorage.getItem(LS_NAME);
let presenceChannel = null;
let notifPermissionAsked = false;

const $ = (sel) => document.querySelector(sel);
const gateEl = $('#gate');
const chatEl = $('#chat');
const nameInput = $('#name-input');
const enterBtn = $('#enter-btn');
const gateErr = $('#gate-err');
const messagesEl = $('#messages');
const textInput = $('#text-input');
const sendBtn = $('#send-btn');
const byteCounterEl = $('#byte-counter');
const memberCountEl = $('#member-count');

/* ============================================================
   起動処理
   ============================================================ */
init();

async function init() {
  if (myDbid && myName) {
    // 既存ユーザー: サーバーと同期(upsert)してからチャットへ
    const ok = await syncUserToServer(myDbid, myName);
    if (ok) {
      enterChat();
      return;
    }
    // 同期に失敗した場合(名前が別の人に取られた等)は入室画面へ
  }
  showGate();
}

function showGate() {
  gateEl.style.display = 'flex';
  chatEl.style.display = 'none';
  nameInput.value = myName || '';
  nameInput.focus();
}

enterBtn.addEventListener('click', handleEnter);
nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleEnter(); });

async function handleEnter() {
  const name = nameInput.value.trim();
  gateErr.textContent = '';
  if (!name) { gateErr.textContent = '表示名を入力してください。'; return; }
  if (name.length > 20) { gateErr.textContent = '表示名は20文字以内にしてください。'; return; }

  enterBtn.disabled = true; enterBtn.textContent = '確認中…';

  // ランダムID発行API(Web Crypto API)でdbidを新規発行
  const newDbid = myDbid || crypto.randomUUID();
  const ok = await syncUserToServer(newDbid, name);

  enterBtn.disabled = false; enterBtn.textContent = 'はじめる';

  if (ok) {
    myDbid = newDbid;
    myName = name;
    localStorage.setItem(LS_DBID, myDbid);
    localStorage.setItem(LS_NAME, myName);
    enterChat();
  }
}

// users テーブルへ upsert。表示名の重複は一意制約違反(23505)で検知する。
async function syncUserToServer(dbid, name) {
  const { error } = await supabase
    .from('users')
    .upsert({ dbid, display_name: name, updated_at: new Date().toISOString() }, { onConflict: 'dbid' });

  if (error) {
    if (error.code === '23505') {
      gateErr.textContent = 'その表示名はすでに使われています。別の名前にしてください。';
    } else {
      gateErr.textContent = '接続エラー: ' + error.message;
    }
    return false;
  }
  return true;
}

/* ============================================================
   チャット画面
   ============================================================ */
function enterChat() {
  gateEl.style.display = 'none';
  chatEl.style.display = 'flex';
  loadMessages();
  subscribeRealtime();
  subscribePresence();
}

async function loadMessages() {
  messagesEl.innerHTML = '<div class="empty-hint">読み込み中…</div>';
  const { data, error } = await supabase
    .from('messages')
    .select('*')
    .order('created_at', { ascending: true })
    .limit(300);

  messagesEl.innerHTML = '';
  if (error) {
    messagesEl.innerHTML = `<div class="empty-hint">読み込みに失敗しました: ${escapeHtml(error.message)}</div>`;
    return;
  }
  if (!data.length) {
    messagesEl.innerHTML = '<div class="empty-hint">まだメッセージはありません。<br>最初のひとことを送ってみましょう。</div>';
    return;
  }
  let lastDay = null;
  for (const m of data) {
    lastDay = maybeInsertDaySeparator(m.created_at, lastDay);
    renderMessage(m);
  }
  scrollToBottom();
}

function maybeInsertDaySeparator(iso, lastDay) {
  const day = new Date(iso).toLocaleDateString('ja-JP');
  if (day !== lastDay) {
    const sep = document.createElement('div');
    sep.className = 'day-sep';
    sep.innerHTML = `<span>${escapeHtml(day)}</span>`;
    messagesEl.appendChild(sep);
  }
  return day;
}

/* ---------- リアルタイム購読(常に最新に保つ) ---------- */
function subscribeRealtime() {
  supabase
    .channel('messages-changes')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
      renderMessage(payload.new);
      scrollToBottom();
      notifyIfHidden(payload.new);
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, (payload) => {
      const el = document.querySelector(`[data-msg-id="${payload.old.id}"]`);
      if (el) el.remove();
    })
    .subscribe();
}

/* ---------- Presence(今この部屋にいる人をリアルタイム表示) ---------- */
function subscribePresence() {
  if (presenceChannel) supabase.removeChannel(presenceChannel);
  presenceChannel = supabase.channel('room:main-presence', {
    config: { presence: { key: myDbid } }
  });
  presenceChannel
    .on('presence', { event: 'sync' }, () => {
      const state = presenceChannel.presenceState();
      const count = Object.keys(state).length;
      memberCountEl.textContent = `${count}人が参加中`;
    })
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        await presenceChannel.track({ name: myName, online_at: new Date().toISOString() });
      }
    });
}

/* ---------- メッセージ描画(LINE風バブル) ---------- */
function renderMessage(m) {
  if (document.querySelector(`[data-msg-id="${m.id}"]`)) return; // 重複防止

  const mine = m.sender_dbid === myDbid;
  const row = document.createElement('div');
  row.className = 'msg-row ' + (mine ? 'mine' : 'theirs');
  row.dataset.msgId = m.id;

  const time = new Date(m.created_at).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

  const col = document.createElement('div');
  col.className = 'bubble-col';

  if (!mine) {
    const nm = document.createElement('div');
    nm.className = 'sender-name';
    nm.textContent = m.sender_name;
    col.appendChild(nm);
  }

  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';

  if (!mine) {
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = (m.sender_name || '?').slice(0, 1).toUpperCase();
    wrap.appendChild(avatar);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  fillBubbleContent(bubble, m.content);

  const meta = document.createElement('div');
  meta.className = 'meta';
  const t = document.createElement('div');
  t.className = 'time';
  t.textContent = time;
  meta.appendChild(t);
  if (mine) {
    const del = document.createElement('button');
    del.className = 'del-btn';
    del.textContent = '削除';
    del.addEventListener('click', () => deleteMessage(m.id));
    meta.appendChild(del);
  }

  wrap.appendChild(bubble);
  wrap.appendChild(meta);
  col.appendChild(wrap);
  row.appendChild(col);
  messagesEl.appendChild(row);
}

// 長文(300文字超)は折りたたんで表示し、ボタンで展開/縮小できるようにする
function fillBubbleContent(bubble, content) {
  if (content.length <= COLLAPSE_LEN) {
    bubble.textContent = content;
    return;
  }
  const short = content.slice(0, COLLAPSE_LEN);
  const textNode = document.createElement('span');
  textNode.textContent = short + '…';
  const toggle = document.createElement('div');
  toggle.className = 'more-toggle';
  toggle.textContent = `もっと見る (${content.length}文字)`;

  let expanded = false;
  toggle.addEventListener('click', () => {
    expanded = !expanded;
    textNode.textContent = expanded ? content : short + '…';
    toggle.textContent = expanded ? '閉じる' : `もっと見る (${content.length}文字)`;
  });

  bubble.innerHTML = '';
  bubble.appendChild(textNode);
  bubble.appendChild(toggle);
}

async function deleteMessage(id) {
  if (!confirm('このメッセージを削除しますか？')) return;
  const { error } = await supabase.from('messages').delete().eq('id', id);
  if (error) {
    showToast('削除に失敗しました: ' + error.message);
  } else {
    const el = document.querySelector(`[data-msg-id="${id}"]`);
    if (el) el.remove();
  }
}

/* ---------- 送信 ---------- */
textInput.addEventListener('input', () => {
  autoGrow(textInput);
  updateByteCounter();
});
sendBtn.addEventListener('click', sendMessage);
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function currentByteLength() {
  return new TextEncoder().encode(textInput.value).length; // TextEncoder APIで実バイト数を計測
}

function updateByteCounter() {
  const bytes = currentByteLength();
  byteCounterEl.textContent = `${bytes.toLocaleString()} / ${MAX_BYTES.toLocaleString()} バイト`;
  byteCounterEl.classList.toggle('over', bytes > MAX_BYTES);
  sendBtn.disabled = bytes === 0 || bytes > MAX_BYTES;
}

async function sendMessage() {
  const content = textInput.value;
  const trimmed = content.trim();
  if (!trimmed) return;
  const bytes = currentByteLength();
  if (bytes > MAX_BYTES) {
    showToast('メッセージが大きすぎます(上限1024KB)。');
    return;
  }

  sendBtn.disabled = true;
  const { error } = await supabase.from('messages').insert({
    sender_dbid: myDbid,
    sender_name: myName,
    content: content,
  });
  sendBtn.disabled = false;

  if (error) {
    showToast('送信に失敗しました: ' + error.message);
    return;
  }
  textInput.value = '';
  autoGrow(textInput);
  updateByteCounter();
}

function scrollToBottom() {
  requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
}

/* ============================================================
   設定パネル(表示名変更 / ID再発行 / IDコピー)
   ============================================================ */
$('#settings-btn').addEventListener('click', openSettings);

function openSettings() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-sheet">
      <button class="close-x">✕</button>
      <h2>設定</h2>

      <label>あなたのID(dbid)</label>
      <div class="id-display">
        <span id="dbid-text">${escapeHtml(myDbid)}</span>
        <button id="copy-id-btn">コピー</button>
      </div>

      <label>表示名の変更</label>
      <input type="text" id="rename-input" maxlength="20" value="${escapeHtml(myName)}">
      <button class="row-btn primary" id="rename-btn">表示名を変更する</button>

      <button class="row-btn ghost" id="regen-btn">IDを再発行する（別端末として扱われます）</button>
      <button class="row-btn ghost" id="notif-btn">通知を有効にする</button>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  overlay.querySelector('.close-x').addEventListener('click', () => overlay.remove());

  // Clipboard APIでIDをコピー
  overlay.querySelector('#copy-id-btn').addEventListener('click', async () => {
    await navigator.clipboard.writeText(myDbid);
    showToast('IDをコピーしました');
  });

  overlay.querySelector('#rename-btn').addEventListener('click', async () => {
    const newName = overlay.querySelector('#rename-input').value.trim();
    if (!newName) return;
    if (newName === myName) { overlay.remove(); return; }
    const { error } = await supabase.from('users')
      .update({ display_name: newName, updated_at: new Date().toISOString() })
      .eq('dbid', myDbid);
    if (error) {
      showToast(error.code === '23505' ? 'その表示名は使われています' : '変更に失敗しました');
      return;
    }
    // 過去メッセージの表示名も追従させる
    await supabase.from('messages').update({ sender_name: newName }).eq('sender_dbid', myDbid);
    myName = newName;
    localStorage.setItem(LS_NAME, myName);
    await presenceChannel.track({ name: myName, online_at: new Date().toISOString() });
    showToast('表示名を変更しました');
    overlay.remove();
  });

  overlay.querySelector('#regen-btn').addEventListener('click', async () => {
    if (!confirm('IDを再発行すると、以前のIDとは別の参加者として扱われます。よろしいですか？')) return;
    const newDbid = crypto.randomUUID();
    // dbidを更新 -> ON UPDATE CASCADEにより過去メッセージのsender_dbidも自動追従
    const { error } = await supabase.from('users')
      .update({ dbid: newDbid, updated_at: new Date().toISOString() })
      .eq('dbid', myDbid);
    if (error) {
      showToast('再発行に失敗しました: ' + error.message);
      return;
    }
    myDbid = newDbid;
    localStorage.setItem(LS_DBID, myDbid);
    showToast('新しいIDを発行しました');
    overlay.remove();
    subscribePresence();
    loadMessages(); // mine/theirs判定をやり直すため再描画
  });

  overlay.querySelector('#notif-btn').addEventListener('click', async () => {
    if (!('Notification' in window)) { showToast('この端末は通知に対応していません'); return; }
    const perm = await Notification.requestPermission();
    showToast(perm === 'granted' ? '通知を有効にしました' : '通知が許可されませんでした');
  });
}

/* ---------- Notification API: タブが非アクティブな時だけ新着を通知 ---------- */
function notifyIfHidden(m) {
  if (m.sender_dbid === myDbid) return;
  if (document.visibilityState !== 'hidden') return; // Page Visibility API
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const n = new Notification(m.sender_name, {
    body: m.content.length > 60 ? m.content.slice(0, 60) + '…' : m.content,
  });
  n.onclick = () => window.focus();
}

/* ---------- 共通ユーティリティ ---------- */
function showToast(text) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
